<title>Mon Dossier Santé</title>
<style>
:root{
  --bg:#f2f5f7;--card:#fff;--ink:#0f1f2a;--muted:#64748b;--line:#e2e8ee;
  --brand:#0f766e;--brand-2:#14b8a6;--brand-bg:#e6f4f2;
  --hi:#c62828;--hi-bg:#fde7e7;--lo:#1d4ed8;--lo-bg:#e0e9fd;
  --lim:#a16207;--lim-bg:#fdf3d6;--ok:#15803d;--ok-bg:#ddf5e5;--info-bg:#edf1f5;
  --shadow:0 1px 2px rgba(15,31,42,.05),0 4px 16px rgba(15,31,42,.06);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0c1419;--card:#152029;--ink:#e6edf2;--muted:#8fa1b0;--line:#223240;
  --brand:#2dd4bf;--brand-2:#14b8a6;--brand-bg:#123330;
  --hi:#f87171;--hi-bg:#3a1a1c;--lo:#7aa2ff;--lo-bg:#1a2442;--lim:#fbbf24;--lim-bg:#3a2e12;
  --ok:#4ade80;--ok-bg:#14301f;--info-bg:#1d2a35;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:720px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 2px 10px}
.topbar .back{display:none}
.topbar.has-back .back{display:grid}
.topbar h1{font-size:22px;margin:0;letter-spacing:-.01em}
.topbar .kicker{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.topbar .grow{flex:1;min-width:0}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);padding:14px;margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.stat.alert b{color:var(--hi)}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border:0}
.hero h2{margin:0 0 4px;font-size:16px}
.hero p{margin:0;opacity:.92;font-size:13px}
.hero .pill{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;margin:8px 6px 0 0;font-size:13px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:10px}
.search input{border:0;background:transparent;outline:0;padding:11px 0;width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.chip.on{color:#05201d}}
.group-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 4px 8px;font-weight:600}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:active{background:var(--info-bg)}
.row-main{flex:1;min-width:0}
.row-name{font-weight:600}
.row-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-val{text-align:right;flex:none}
.val{font-weight:700;font-variant-numeric:tabular-nums}
.val small{font-weight:400;color:var(--muted);font-size:12px}
.trend{font-size:12px;color:var(--muted);margin-left:2px}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;margin-top:3px}
.b-haut{background:var(--hi-bg);color:var(--hi)}
.b-bas{background:var(--lo-bg);color:var(--lo)}
.b-limite{background:var(--lim-bg);color:var(--lim)}
.b-normal{background:var(--ok-bg);color:var(--ok)}
.b-info{background:var(--info-bg);color:var(--muted)}
.bigval{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bigval small{font-size:15px;font-weight:500;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.obs{background:var(--info-bg);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
svg.chart{width:100%;height:auto;display:block}
.hist .row{cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#05201d}}
.btn.danger{color:var(--hi)}
.btn.block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn-row .btn{flex:1}
label.f{display:block;font-size:12px;color:var(--muted);margin:0 0 4px;font-weight:600}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;outline:0}
.in:focus{border-color:var(--brand)}
textarea.in{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mb{margin-bottom:10px}
.frow{border:1px dashed var(--line);border-radius:14px;padding:12px;margin-bottom:10px;position:relative}
.frow .rm{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:9px;border:0;background:var(--hi-bg);color:var(--hi);cursor:pointer;font-weight:700}
.frow .num{font-size:12px;font-weight:700;color:var(--brand);margin-bottom:8px}
.frow .live{font-size:12px;margin-top:6px}
details.paste summary{cursor:pointer;font-weight:600;color:var(--brand);padding:4px 0}
.bilan-card{display:block}
.bilan-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.date-box{flex:none;width:54px;text-align:center;background:var(--brand-bg);color:var(--brand);border-radius:12px;padding:6px 0;line-height:1.1}
.date-box b{display:block;font-size:20px}
.date-box span{font-size:11px;text-transform:uppercase}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:20px 8px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:6px 10px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;max-width:140px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer;padding:4px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--brand);font-weight:600}
.fab{width:58px;height:58px;border-radius:18px;border:0;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 20px rgba(15,118,110,.35);cursor:pointer}
.fab svg{width:28px;height:28px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;transform:translateY(105%);transition:transform .22s ease}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet .item{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:13px 4px;border-top:1px solid var(--line);text-align:left;cursor:pointer}
.sheet .item:first-of-type{border-top:0}
.sheet .item small{display:block;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}
table.res{width:100%;border-collapse:collapse;font-size:13px}
table.res td{padding:9px 4px;border-top:1px solid var(--line);vertical-align:top}
table.res tr:first-child td{border-top:0}
table.res td.v{text-align:right;white-space:nowrap;font-weight:700}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.stat b{font-size:19px}}
@media print{.tabbar,.topbar .icon-btn,.btn-row,.search,.chips{display:none!important}body{background:#fff}.card,.list,.stat{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar">

<script>
/* ============ DONNÉES INITIALES (bilan de départ) ============ */
const SEED_ROWS = [
 ['Biochimie','Acide urique','437','µmol/L',202.3,416.5,'Au-dessus de la limite haute imprimée.'],
 ['Biochimie','ALAT','25,1','U/L',10,50,''],
 ['Biochimie','ASAT','29,4','U/L',10,50,''],
 ['Biochimie','Cholestérol total','3,69','mmol/L',2.6,6.2,''],
 ['Biochimie','Créatininémie','87,9','µmol/L',62,106,''],
 ['Biochimie','Glycémie','3,91','mmol/L',4.11,6.05,'Sous la limite basse imprimée.'],
 ['Biochimie','HDL cholestérol','1,07','mmol/L',1.0,2.0,''],
 ['Biochimie','LDL cholestérol','2,11','mmol/L',0.4,4.16,''],
 ['Biochimie','Triglycérides','1,41','mmol/L',0.5,1.8,''],
 ['Hématologie','Leucocytes','7,37','10^3/µL',4,10,''],

 ['Hématologie','Lymphocytes','43,8','%',null,null,''],
 ['Hématologie','Monocytes absolus','0,61','10^3/µL',0.1,1,''],
 ['Hématologie','Monocytes','8,3','%',null,null,''],
 ['Hématologie','Éosinophiles absolus','0,14','10^3/µL',0.05,0.5,''],
 ['Hématologie','Éosinophiles','1,9','%',null,null,''],
 ['Hématologie','Basophiles absolus','0,07','10^3/µL',0,0.05,'Signalés + sur le compte rendu.'],
 ['Hématologie','Basophiles','0,9','%',null,null,''],
 ['Hématologie','Granulocytes immatures absolus','0,02','10^3/µL',null,null,''],
 ['Hématologie','Granulocytes immatures','0,3','%',null,null,''],
 ['Hématologie','Globules rouges / hématies','6,14','10^6/µL',4.5,6,'Signalés + sur le compte rendu.'],
 ['Hématologie','Hémoglobine','13,1','g/dL',13,17,'Proche de la limite basse.'],
 ['Hématologie','Hématocrite','37,8','%',40,54,'Sous la limite basse imprimée.'],
 ['Hématologie','VGM','61,6','fL',80,100,'Sous la limite basse imprimée.'],
 ['Hématologie','TCMH','21,3','pg',27,34,'Sous la limite basse imprimée.'],
 ['Hématologie','CCMH','34,7','g/dL',32,36,''],
 ['Hématologie','IDR-SD / RDW-SD','40,6','fL',37,54,''],
 ['Hématologie','IDR-CV / RDW-CV','20,8','%',11,14,'Signalé + sur le compte rendu.'],
 ['Hématologie','Plaquettes','234','10^3/µL',150,400,''],
 ['Hématologie','Érythroblastes','0,00','10^3/µL',null,null,'0,0 % indiqué.'],
 ['Hématologie','Commentaire automate','Anisocytose ; microcytose','',null,null,'Le compte rendu mentionne aussi « PLT Abn Distribution ».'],
];
const SEED = {version:1, bilans:[{
  id:'b-initial', date:'2026-11-20', titre:'Bilan biologique complet', labo:'', notes:'Date à corriger si besoin (Modifier le bilan).',
  resultats: SEED_ROWS.map(([cat,param,val,unit,min,max,obs])=>({cat,param,val,unit,min,max,obs}))
}]};

/* ============ STOCKAGE ============ */
const KEY='dossier-sante-v1';
let db = load();
function load(){ try{ const s=localStorage.getItem(KEY); if(s){ const d=JSON.parse(s); if(d && Array.isArray(d.bilans)) return d; } }catch(e){} return structuredClone(SEED); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('⚠️ Stockage indisponible — exportez vos données'); } }

/* ============ OUTILS ============ */
const CATS=['Biochimie','Hématologie','Hormonologie','Sérologie','Immunologie','Urines','Constantes','Imagerie','Autre'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{ if(v===null||v===undefined||v==='') return NaN; return parseFloat(String(v).replace(/\s/g,'').replace(',','.')); };
const nOrNull=v=>{ const n=num(v); return isNaN(n)?null:n; };
const fmtN=n=>n==null?'':String(n).replace('.',',');
const keyOf=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%]+/g,' ').trim();
const uid=()=>'b-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=(d,o={day:'2-digit',month:'short',year:'numeric'})=>{ try{return new Date(d+'T00:00:00').toLocaleDateString('fr-FR',o);}catch(e){return d;} };
function refTxt(r){ const a=r.min,b=r.max; if(a!=null&&b!=null) return `Réf. ${fmtN(a)}–${fmtN(b)}`; if(b!=null) return `Réf. ≤ ${fmtN(b)}`; if(a!=null) return `Réf. ≥ ${fmtN(a)}`; return 'Sans valeur de référence'; }
function status(r){
  const v=num(r.val); const a=r.min, b=r.max;
  if(isNaN(v) || (a==null && b==null)) return 'info';
  if(a!=null && v<a) return 'bas';
  if(b!=null && v>b) return 'haut';
  if(a!=null && b!=null){ const m=(b-a)*0.05; if(v-a<=m || b-v<=m) return 'limite'; }
  return 'normal';
}
const LBL={haut:'↑ Élevé',bas:'↓ Bas',limite:'≈ Limite',normal:'Normal',info:'Info'};
const badge=s=>`<span class="badge b-${s}">${LBL[s]}</span>`;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
const sortedBilans=()=>[...db.bilans].sort((a,b)=>b.date.localeCompare(a.date));

/* Registre général : dernière valeur + historique de chaque paramètre */
function registre(){
  const m=new Map();
  const asc=[...db.bilans].sort((a,b)=>a.date.localeCompare(b.date));
  for(const b of asc) for(const r of b.resultats){
    const k=keyOf(r.param); if(!k) continue;
    if(!m.has(k)) m.set(k,{key:k,hist:[]});
    m.get(k).hist.push({...r,date:b.date,bid:b.id,titre:b.titre});
  }
  for(const p of m.values()){
    p.hist.sort((a,b)=>a.date.localeCompare(b.date));
    p.last=p.hist[p.hist.length-1]; p.param=p.last.param; p.cat=p.last.cat||'Autre'; p.st=status(p.last);
  }
  return m;
}
function trend(p){
  const nums=p.hist.filter(h=>!isNaN(num(h.val)));
  if(nums.length<2) return '';
  const a=num(nums[nums.length-2].val), b=num(nums[nums.length-1].val);
  return `<span class="trend">${b>a?'▲':b<a?'▼':'='}</span>`;
}

/* ============ VUES ============ */
const ui={filter:'Tous',q:''};
function setHeader(title,back){ $('#title').textContent=title; $('#topbar').classList.toggle('has-back',!!back); $('#backBtn').onclick=()=>{ history.length>1?history.back():(location.hash=back); }; }

function vRegistre(){
  setHeader('Registre santé',false);
  const R=[...registre().values()];
  const out=R.filter(p=>p.st==='haut'||p.st==='bas');
  const last=sortedBilans()[0];
  const cats=[...new Set(R.map(p=>p.cat))];
  $('#view').innerHTML=`
    <div class="card hero">
      <h2>${out.length? out.length+' paramètre'+(out.length>1?'s':'')+' hors des valeurs de référence':'Tous les paramètres dans les valeurs de référence'}</h2>
      <p>Dernier bilan : ${last?fmtDate(last.date,{day:'numeric',month:'long',year:'numeric'}):'—'}</p>
      ${out.slice(0,12).map(p=>`<a class="pill" href="#/param/${encodeURIComponent(p.key)}">${esc(p.param)} ${p.st==='haut'?'↑':'↓'}</a>`).join('')}
    </div>
    <div class="stats">
      <div class="stat"><b>${R.length}</b><span>Paramètres suivis</span></div>
      <div class="stat alert"><b>${out.length}</b><span>Hors norme</span></div>
      <div class="stat"><b>${db.bilans.length}</b><span>Bilan${db.bilans.length>1?'s':''}</span></div>
    </div>
    <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" opacity=".5"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Rechercher un paramètre…" value="${esc(ui.q)}"></div>
    <div class="chips" id="chips">${['Tous','Hors norme',...cats].map(c=>`<button class="chip ${ui.filter===c?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div id="list"></div>
    <p class="foot">Données enregistrées uniquement dans ce navigateur. Exportez régulièrement via le menu ⋯.<br>Ce registre ne remplace pas l'avis d'un médecin.</p>`;
  const draw=()=>{
    const q=keyOf(ui.q);
    let L=R.filter(p=>!q||p.key.includes(q));
    if(ui.filter==='Hors norme') L=L.filter(p=>p.st==='haut'||p.st==='bas'||p.st==='limite');
    else if(ui.filter!=='Tous') L=L.filter(p=>p.cat===ui.filter);
    if(!L.length){ $('#list').innerHTML='<div class="empty">Aucun résultat</div>'; return; }
    const groups={}; L.forEach(p=>(groups[p.cat]=groups[p.cat]||[]).push(p));
    $('#list').innerHTML=Object.entries(groups).map(([c,ps])=>`
      <div class="group-title">${esc(c)} · ${ps.length}</div>
      <div class="list">${ps.map(p=>`
        <a class="row" href="#/param/${encodeURIComponent(p.key)}">
          <div class="row-main"><div class="row-name">${esc(p.param)}</div>
            <div class="row-sub">${esc(refTxt(p.last))}${p.last.unit&&(p.last.min!=null||p.last.max!=null)?' '+esc(p.last.unit):''} · ${fmtDate(p.last.date)}</div></div>
          <div class="row-val"><div class="val">${esc(p.last.val)} <small>${esc(p.last.unit)}</small>${trend(p)}</div>${badge(p.st)}</div>
        </a>`).join('')}</div>`).join('');
  };
  draw();
  $('#q').oninput=e=>{ui.q=e.target.value;draw();};
  $('#chips').onclick=e=>{ const b=e.target.closest('.chip'); if(!b) return; ui.filter=b.dataset.c; document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b)); draw(); };
}

function chart(p){
  const pts=p.hist.map(h=>({d:h.date,v:num(h.val),h})).filter(x=>!isNaN(x.v));
  if(!pts.length) return '';
  const W=340,H=170,pl=40,pr=14,pt=14,pb=28;
  const lo=p.last.min, hi=p.last.max;
  const vals=pts.map(x=>x.v); if(lo!=null) vals.push(lo); if(hi!=null) vals.push(hi);
  let mn=Math.min(...vals), mx=Math.max(...vals); const pad=((mx-mn)||Math.abs(mx)||1)*0.18; mn-=pad; mx+=pad;
  const X=i=>pts.length===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(pts.length-1);
  const Y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
  const col={haut:'var(--hi)',bas:'var(--lo)',limite:'var(--lim)',normal:'var(--ok)',info:'var(--muted)'};
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution ${esc(p.param)}">`;
  if(lo!=null||hi!=null){ const y1=Y(hi??mx), y2=Y(lo??mn); s+=`<rect x="${pl}" y="${y1}" width="${W-pl-pr}" height="${Math.max(0,y2-y1)}" fill="var(--ok-bg)" rx="6"/>`; }
  [lo,hi].forEach(v=>{ if(v!=null) s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--ok)" stroke-dasharray="3 4" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtN(v)}</text>`; });
  if(pts.length>1) s+=`<polyline fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.map((x,i)=>X(i)+','+Y(x.v)).join(' ')}"/>`;
  pts.forEach((x,i)=>{ s+=`<circle cx="${X(i)}" cy="${Y(x.v)}" r="5" fill="${col[status(x.h)]}" stroke="var(--card)" stroke-width="2"/>`; });
  const show=pts.length<=5?pts.map((_,i)=>i):[0,pts.length-1];
  show.forEach(i=>{ s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${fmtDate(pts[i].d,{day:'2-digit',month:'short',year:'2-digit'})}</text>`; });
  return s+'</svg>';
}

function vParam(k){
  const p=registre().get(k);
  if(!p){ location.hash='#/registre'; return; }
  setHeader(p.param,'#/registre');
  const l=p.last;
  $('#view').innerHTML=`
    <div class="card">
      <div class="muted small">${esc(p.cat)} · dernière mesure le ${fmtDate(l.date,{day:'numeric',month:'long',year:'numeric'})}</div>
      <div class="bigval">${esc(l.val)} <small>${esc(l.unit)}</small></div>
      ${badge(p.st)} <span class="muted small">&nbsp;${esc(refTxt(l))} ${l.min!=null||l.max!=null?esc(l.unit):''}</span>
      ${l.obs?`<div class="obs">${esc(l.obs)}</div>`:''}
    </div>
    ${chart(p)?`<div class="card"><div class="group-title" style="margin-top:0">Évolution</div>${chart(p)}</div>`:''}
    <div class="group-title">Historique · ${p.hist.length} mesure${p.hist.length>1?'s':''}</div>
    <div class="list">${[...p.hist].reverse().map(h=>`
      <a class="row" href="#/bilan/${h.bid}">
        <div class="row-main"><div class="row-name">${fmtDate(h.date,{day:'numeric',month:'long',year:'numeric'})}</div><div class="row-sub">${esc(h.titre||'Bilan')}${h.obs?' · '+esc(h.obs):''}</div></div>
        <div class="row-val"><div class="val">${esc(h.val)} <small>${esc(h.unit)}</small></div>${badge(status(h))}</div>
      </a>`).join('')}</div>
    <div class="btn-row"><a class="btn primary" href="#/ajouter">＋ Nouvelle mesure</a></div>`;
  const addBtn=$('#view .btn.primary'); addBtn.onclick=e=>{ e.preventDefault(); pending={cat:l.cat,param:l.param,unit:l.unit,min:l.min,max:l.max}; location.hash='#/ajouter'; };
}

function vBilans(){
  setHeader('Mes bilans',false);
  const B=sortedBilans();
  $('#view').innerHTML=`
    <div class="btn-row"><a class="btn primary" href="#/ajouter">＋ Enregistrer un bilan</a></div>
    ${B.length?B.map(b=>{
      const n=b.resultats.filter(r=>['haut','bas'].includes(status(r))).length;
      return `<a class="card bilan-card" href="#/bilan/${b.id}"><div class="top">
        <div class="date-box"><b>${fmtDate(b.date,{day:'2-digit'})}</b><span>${fmtDate(b.date,{month:'short'})}<br>${fmtDate(b.date,{year:'numeric'})}</span></div>
        <div style="flex:1;min-width:0"><div class="row-name">${esc(b.titre||'Bilan')}</div>
          <div class="row-sub">${esc(b.labo||'Laboratoire non précisé')}</div>
          <div class="small" style="margin-top:6px">${b.resultats.length} résultat${b.resultats.length>1?'s':''} ${n?`· <span class="badge b-haut">${n} hors norme</span>`:'· <span class="badge b-normal">RAS</span>'}</div></div>
      </div></a>`;}).join(''):'<div class="empty">Aucun bilan enregistré</div>'}`;
}

function vBilan(id){
  const b=db.bilans.find(x=>x.id===id);
  if(!b){ location.hash='#/bilans'; return; }
  setHeader(b.titre||'Bilan','#/bilans');
  const groups={}; b.resultats.forEach(r=>(groups[r.cat||'Autre']=groups[r.cat||'Autre']||[]).push(r));
  $('#view').innerHTML=`
    <div class="card">
      <div class="bigval" style="font-size:22px">${fmtDate(b.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
      <div class="muted small">${esc(b.labo||'Laboratoire non précisé')} · ${b.resultats.length} résultats</div>
      ${b.notes?`<div class="obs">${esc(b.notes)}</div>`:''}
    </div>
    ${Object.entries(groups).map(([c,rs])=>`<div class="group-title">${esc(c)}</div><div class="card"><table class="res">${rs.map(r=>`
      <tr><td><a href="#/param/${encodeURIComponent(keyOf(r.param))}"><b>${esc(r.param)}</b></a><div class="muted" style="font-size:12px">${esc(refTxt(r))}${r.obs?' · '+esc(r.obs):''}</div></td>
      <td class="v">${esc(r.val)} <span class="muted" style="font-weight:400">${esc(r.unit)}</span><br>${badge(status(r))}</td></tr>`).join('')}</table></div>`).join('')}
    <div class="btn-row">
      <a class="btn" href="#/modifier/${b.id}">✏️ Modifier</a>
      <a class="btn" href="#/ajouter/${b.id}">＋ Ajouter un résultat</a>
    </div>
    <button class="btn danger block" id="delB">Supprimer ce bilan</button>`;
  $('#delB').onclick=()=>{ if(confirm('Supprimer définitivement ce bilan ?')){ db.bilans=db.bilans.filter(x=>x.id!==id); save(); toast('Bilan supprimé'); location.hash='#/bilans'; } };
}

/* ---------- Formulaire : Enregistrer un résultat / bilan ---------- */
let pending=null;
function rowHTML(r={}){
  return `<div class="frow">
    <button type="button" class="rm" title="Retirer">×</button>
    <div class="num"></div>
    <div class="grid2 mb">
      <div><label class="f">Paramètre *</label><input class="in" data-f="param" list="dlParams" value="${esc(r.param)}" placeholder="ex. Glycémie"></div>
      <div><label class="f">Catégorie</label><input class="in" data-f="cat" list="dlCats" value="${esc(r.cat||'')}" placeholder="Biochimie…"></div>
    </div>
    <div class="grid3 mb">
      <div><label class="f">Résultat *</label><input class="in" data-f="val" value="${esc(r.val)}" inputmode="decimal" placeholder="0,00"></div>
      <div><label class="f">Unité</label><input class="in" data-f="unit" value="${esc(r.unit)}" placeholder="mmol/L"></div>
      <div><label class="f">Réf. min</label><input class="in" data-f="min" value="${esc(fmtN(r.min))}" inputmode="decimal"></div>
      <div><label class="f">Réf. max</label><input class="in" data-f="max" value="${esc(fmtN(r.max))}" inputmode="decimal"></div>
    </div>
    <div><label class="f">Observation</label><input class="in" data-f="obs" value="${esc(r.obs)}" placeholder="Commentaire du compte rendu…"></div>
    <div class="live"></div>
  </div>`;
}
function readRow(el){ const g=f=>el.querySelector(`[data-f="${f}"]`).value.trim(); return {cat:g('cat')||'Autre',param:g('param'),val:g('val'),unit:g('unit'),min:nOrNull(g('min')),max:nOrNull(g('max')),obs:g('obs')}; }
function parseRef(s){
  s=String(s||'').trim(); if(!s||/^[—–\-]$/.test(s)) return [null,null];
  let m=s.match(/(-?[\d.,]+)\s*[–—\-àa]+\s*(-?[\d.,]+)/); if(m) return [nOrNull(m[1]),nOrNull(m[2])];
  m=s.match(/^[<≤]\s*([\d.,]+)/); if(m) return [null,nOrNull(m[1])];
  m=s.match(/^[>≥]\s*([\d.,]+)/); if(m) return [nOrNull(m[1]),null];
  return [null,null];
}
function parsePaste(txt){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>l.includes('\t')?l.split('\t'):l.split(/\s*;\s*|\s{2,}/))
    .filter(c=>c.length>=3 && !/^cat[ée]gorie$/i.test(c[0].trim()))
    .map(c=>{ const [mn,mx]=parseRef(c[4]); return {cat:(c[0]||'').trim(),param:(c[1]||'').trim(),val:(c[2]||'').trim(),unit:(c[3]||'').trim(),min:mn,max:mx,obs:(c[5]||'').trim()}; })
    .filter(r=>r.param&&r.val);
}

function vForm(mode,id){
  const editing = mode==='edit' ? db.bilans.find(x=>x.id===id) : null;
  if(mode==='edit' && !editing){ location.hash='#/bilans'; return; }
  const target = mode==='add' ? (id||'') : '';
  setHeader(editing?'Modifier le bilan':'Enregistrer un résultat', editing?'#/bilan/'+id:(target?'#/bilan/'+target:false));
  const R=registre();
  const rows = editing ? editing.resultats : [pending||{}];
  pending=null;
  $('#view').innerHTML=`
    <datalist id="dlCats">${CATS.map(c=>`<option value="${c}">`).join('')}</datalist>
    <datalist id="dlParams">${[...R.values()].map(p=>`<option value="${esc(p.param)}">`).join('')}</datalist>
    ${editing?'':`<div class="card">
      <label class="f">Enregistrer dans</label>
      <select class="in" id="target"><option value="">➕ Nouveau bilan</option>${sortedBilans().map(b=>`<option value="${b.id}" ${b.id===target?'selected':''}>${fmtDate(b.date)} — ${esc(b.titre||'Bilan')}</option>`).join('')}</select>
    </div>`}
    <div class="card" id="bilanFields">
      <div class="grid2 mb">
        <div><label class="f">Date du bilan *</label><input class="in" type="date" id="fDate" value="${editing?editing.date:today()}"></div>
        <div><label class="f">Laboratoire / médecin</label><input class="in" id="fLabo" value="${esc(editing?.labo)}" placeholder="ex. Labo XYZ"></div>
      </div>
      <div class="mb"><label class="f">Intitulé</label><input class="in" id="fTitre" value="${esc(editing?.titre||'')}" placeholder="ex. Bilan sanguin de contrôle"></div>
      <div><label class="f">Notes</label><textarea class="in" id="fNotes" placeholder="Contexte, prescription, à jeun…">${esc(editing?.notes)}</textarea></div>
    </div>
    <div class="group-title">Résultats</div>
    <div id="rows">${rows.map(rowHTML).join('')}</div>
    <button type="button" class="btn block" id="addRow">＋ Ajouter une ligne</button>
    <div class="card" style="margin-top:12px">
      <details class="paste"><summary>📋 Coller un tableau de résultats</summary>
        <p class="small muted">Collez des lignes au format : Catégorie ⇥ Paramètre ⇥ Résultat ⇥ Unité ⇥ Valeurs de référence ⇥ Observation (copié depuis Excel ou un tableau).</p>
        <textarea class="in" id="pasteTxt" style="min-height:110px" placeholder="Biochimie	Glycémie	5,10	mmol/L	4,11–6,05	"></textarea>
        <div class="btn-row"><button type="button" class="btn" id="pasteGo">Analyser et ajouter</button></div>
      </details>
    </div>
    <div class="btn-row"><button class="btn primary block" id="saveBtn">💾 Enregistrer et actualiser le registre</button></div>`;

  const rowsEl=$('#rows');
  const renum=()=>rowsEl.querySelectorAll('.frow').forEach((el,i)=>{ el.querySelector('.num').textContent='Résultat '+(i+1); live(el); });
  const live=el=>{ const r=readRow(el); el.querySelector('.live').innerHTML = r.param&&r.val ? badge(status(r))+` <span class="muted">${esc(refTxt(r))}</span>` : ''; };
  rowsEl.addEventListener('input',e=>{ const el=e.target.closest('.frow'); if(el) live(el); });
  rowsEl.addEventListener('change',e=>{
    if(e.target.dataset.f!=='param') return;
    const el=e.target.closest('.frow'); const p=R.get(keyOf(e.target.value)); if(!p) return;
    const set=(f,v)=>{ const i=el.querySelector(`[data-f="${f}"]`); if(!i.value && v!=null && v!=='') i.value=typeof v==='number'?fmtN(v):v; };
    set('cat',p.cat); set('unit',p.last.unit); set('min',p.last.min); set('max',p.last.max); live(el);
  });
  rowsEl.addEventListener('click',e=>{ if(e.target.classList.contains('rm')){ const all=rowsEl.querySelectorAll('.frow'); if(all.length>1){ e.target.closest('.frow').remove(); renum(); } else { e.target.closest('.frow').querySelectorAll('input').forEach(i=>i.value=''); live(e.target.closest('.frow')); } } });
  $('#addRow').onclick=()=>{ rowsEl.insertAdjacentHTML('beforeend',rowHTML()); renum(); rowsEl.lastElementChild.querySelector('input').focus(); };
  $('#pasteGo').onclick=()=>{
    const list=parsePaste($('#pasteTxt').value); if(!list.length){ toast('Aucune ligne reconnue'); return; }
    rowsEl.querySelectorAll('.frow').forEach(el=>{ const r=readRow(el); if(!r.param&&!r.val) el.remove(); });
    rowsEl.insertAdjacentHTML('beforeend',list.map(rowHTML).join('')); renum(); $('#pasteTxt').value=''; toast(list.length+' ligne(s) ajoutée(s)');
  };
  const tSel=$('#target');
  const syncTarget=()=>{ if(tSel) $('#bilanFields').style.display=tSel.value?'none':''; };
  if(tSel){ tSel.onchange=syncTarget; syncTarget(); }
  renum();

  $('#saveBtn').onclick=()=>{
    const res=[...rowsEl.querySelectorAll('.frow')].map(readRow).filter(r=>r.param&&r.val);
    if(!res.length){ toast('Renseignez au moins un paramètre et son résultat'); return; }
    if(editing){
      Object.assign(editing,{date:$('#fDate').value||editing.date,labo:$('#fLabo').value.trim(),titre:$('#fTitre').value.trim(),notes:$('#fNotes').value.trim(),resultats:res});
      save(); toast('Bilan mis à jour'); location.hash='#/bilan/'+editing.id; return;
    }
    if(tSel && tSel.value){
      const b=db.bilans.find(x=>x.id===tSel.value);
      res.forEach(r=>{ const i=b.resultats.findIndex(x=>keyOf(x.param)===keyOf(r.param)); i>=0?b.resultats[i]=r:b.resultats.push(r); });
      save(); toast('Registre actualisé'); location.hash='#/bilan/'+b.id; return;
    }
    if(!$('#fDate').value){ toast('Indiquez la date du bilan'); return; }
    const b={id:uid(),date:$('#fDate').value,labo:$('#fLabo').value.trim(),titre:$('#fTitre').value.trim()||'Bilan',notes:$('#fNotes').value.trim(),resultats:res};
    db.bilans.push(b); save(); toast('Registre actualisé ✔'); location.hash='#/registre';
  };
}

/* ============ ROUTAGE ============ */
function route(){
  const parts=(location.hash.replace(/^#\/?/,'')||'registre').split('/');
  const [p,a]=[parts[0],parts.slice(1).join('/')];
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.go==='#/'+(p==='param'?'registre':p==='bilan'||p==='modifier'?'bilans':p)));
  if(p==='param') vParam(decodeURIComponent(a));
  else if(p==='bilans') vBilans();
  else if(p==='bilan') vBilan(a);
  else if(p==='ajouter') vForm('add',a);
  else if(p==='modifier') vForm('edit',a);
  else vRegistre();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ location.hash=b.dataset.go; });

/* ============ MENU ============ */
const openSheet=o=>{ $('#sheet').classList.toggle('open',o); $('#sheetBg').classList.toggle('open',o); };
$('#menuBtn').onclick=()=>openSheet(true);
$('#sheetBg').onclick=()=>openSheet(false);
$('#sheet').onclick=e=>{
  const act=e.target.closest('[data-act]')?.dataset.act; if(!act) return; openSheet(false);
  if(act==='export'){ const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='dossier-sante-'+today()+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('Sauvegarde téléchargée'); }
  if(act==='import') $('#fileIn').click();
  if(act==='print') setTimeout(()=>window.print(),250);
  if(act==='reset' && confirm('Effacer toutes les données de cet appareil et revenir au bilan initial ?')){ db=structuredClone(SEED); save(); location.hash='#/registre'; route(); toast('Réinitialisé'); }
};
$('#fileIn').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!Array.isArray(d.bilans)) throw 0; if(confirm('Remplacer les données actuelles par cette sauvegarde ?')){ db=d; save(); location.hash='#/registre'; route(); toast('Sauvegarde importée'); } }catch(err){ toast('Fichier invalide'); } e.target.value=''; };
  rd.readAsText(f);
};

save(); route();
</script>
</body>
