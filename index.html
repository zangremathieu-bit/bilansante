<title>Mon Dossier Santé</title>
<style>
:root{
  --bg:#060b14;--txt:#eaf6f7;--mut:rgba(226,240,242,.6);--line:rgba(255,255,255,.12);
  --acc:#2ee6c5;--acc2:#38bdf8;--acc3:#a78bfa;
  --hi:#ff6b81;--lo:#60a5fa;--lim:#fbbf24;--ok:#34d399;
  --r:22px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.5,1.7,.4,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;background:var(--bg)}
body{margin:0;color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- Fond animé ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 70% at 50% -10%,#0f2233 0%,#081120 45%,#060b14 100%)}
.blob{position:absolute;border-radius:50%;animation:float 24s ease-in-out infinite alternate;will-change:transform}
.b1{width:80vmax;height:80vmax;left:-35vmax;top:-30vmax;background:radial-gradient(circle,rgba(46,230,197,.30),transparent 62%)}
.b2{width:70vmax;height:70vmax;right:-35vmax;top:18vh;background:radial-gradient(circle,rgba(56,189,248,.26),transparent 62%);animation-duration:30s}
.b3{width:75vmax;height:75vmax;left:0;bottom:-45vmax;background:radial-gradient(circle,rgba(167,139,250,.24),transparent 62%);animation-duration:36s}
.gridfx{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 70%)}
@keyframes float{0%{transform:translate(0,0) scale(1)}50%{transform:translate(7vw,5vh) scale(1.12)}100%{transform:translate(-5vw,9vh) scale(.94)}}

/* ---------- Verre ---------- */
.glass{background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.035));border:1px solid var(--line);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 12px 32px rgba(0,0,0,.35);border-radius:var(--r)}
.app{max-width:640px;margin:0 auto;padding:0 14px calc(120px + env(safe-area-inset-bottom))}

/* ---------- Barre du haut ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 4px 12px;view-transition-name:topbar;
  background:linear-gradient(rgba(6,11,20,.85),rgba(6,11,20,.55));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin:0 -14px 6px;padding-left:18px;padding-right:18px}
.topbar h1{margin:0;font-size:24px;letter-spacing:-.02em;background:linear-gradient(90deg,#fff,#bff7ec 60%,#9fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.kicker{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.14em}
.grow{flex:1;min-width:0}
.icon-btn{width:42px;height:42px;border-radius:14px;display:none;place-items:center;cursor:pointer;transition:transform .2s var(--spring)}
.icon-btn:active{transform:scale(.88)}
.icon-btn svg{width:20px;height:20px}
.topbar.has-back .back{display:grid}
.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#06221d;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 18px rgba(46,230,197,.45)}

/* ---------- Héros + anneau ---------- */
.hero{padding:18px;margin-bottom:12px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at var(--mx,30%) var(--my,20%),rgba(255,255,255,.14),transparent 40%);pointer-events:none;transition:background-position .2s}
.hero h2{margin:0 0 4px;font-size:17px;line-height:1.25}
.hero p{margin:0;color:var(--mut);font-size:13px}
.ring{position:relative;width:108px;height:108px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 8px rgba(46,230,197,.55))}
.ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:9}
.ring-fg{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.5s var(--ease) .15s}
.ring-txt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ring-txt b{font-size:28px;font-weight:800}
.ring-txt small{font-size:13px;color:var(--mut)}
.ring-txt span{font-size:10px;color:var(--mut);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);transition:transform .2s var(--spring)}
.pill:active{transform:scale(.92)}
.pill.haut{border-color:rgba(255,107,129,.45);color:#ffc2cc;box-shadow:0 0 12px rgba(255,107,129,.18)}
.pill.bas{border-color:rgba(96,165,250,.45);color:#c7dcff;box-shadow:0 0 12px rgba(96,165,250,.18)}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{padding:12px 12px 10px;border-radius:18px;position:relative;overflow:hidden;animation:pop3d .6s var(--ease) both;animation-delay:calc(var(--i,0)*70ms + 100ms)}
.stat b{display:block;font-size:24px;line-height:1.1;font-weight:800}
.stat span{font-size:11px;color:var(--mut)}
.stat::before{content:"";position:absolute;left:12px;right:12px;top:0;height:2px;border-radius:2px;background:var(--c,var(--acc));box-shadow:0 0 12px var(--c,var(--acc))}

/* ---------- Recherche / chips ---------- */
.search{display:flex;align-items:center;gap:8px;padding:0 14px;margin-bottom:10px;border-radius:16px}
.search input{border:0;background:transparent;outline:0;padding:12px 0;width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;transition:all .3s var(--spring)}
.chip.on{background:linear-gradient(135deg,rgba(46,230,197,.9),rgba(56,189,248,.9));color:#04201b;border-color:transparent;font-weight:700;box-shadow:0 0 18px rgba(46,230,197,.45);transform:scale(1.05)}

/* ---------- Listes ---------- */
.group-title{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--mut);margin:18px 6px 8px;font-weight:700;display:flex;align-items:center;gap:8px}
.group-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.list{padding:4px;perspective:900px}
.row{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:16px;cursor:pointer;position:relative;
  animation:rowIn .55s var(--ease) both;animation-delay:calc(min(var(--i,0),18)*38ms);transition:background .2s,transform .2s var(--spring);transform-origin:center top}
.row+.row::before{content:"";position:absolute;left:58px;right:10px;top:0;height:1px;background:var(--line)}
.row:active{background:rgba(255,255,255,.07);transform:scale(.975)}
@keyframes rowIn{from{opacity:0;transform:translateY(18px) rotateX(-40deg)}to{opacity:1;transform:none}}
.ic{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.02em;border:1px solid var(--line);background:rgba(255,255,255,.06)}
.ic-haut{color:var(--hi);border-color:rgba(255,107,129,.4);box-shadow:0 0 14px rgba(255,107,129,.25),inset 0 0 10px rgba(255,107,129,.15)}
.ic-bas{color:var(--lo);border-color:rgba(96,165,250,.4);box-shadow:0 0 14px rgba(96,165,250,.25),inset 0 0 10px rgba(96,165,250,.15)}
.ic-limite{color:var(--lim);border-color:rgba(251,191,36,.35)}
.ic-normal{color:var(--ok);border-color:rgba(52,211,153,.3)}
.ic-info{color:var(--mut)}
.row-main{flex:1;min-width:0}
.row-name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-val{text-align:right;flex:none}
.val{font-weight:800;font-variant-numeric:tabular-nums;display:inline-block}
.val small{font-weight:400;color:var(--mut);font-size:11px}
.spark{width:46px;height:18px;flex:none;opacity:.9}
.spark polyline{fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(46,230,197,.7))}
.badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;margin-top:3px;letter-spacing:.02em;border:1px solid transparent}
.b-haut{background:rgba(255,107,129,.14);color:#ff9aab;border-color:rgba(255,107,129,.35);box-shadow:0 0 10px rgba(255,107,129,.25)}
.b-bas{background:rgba(96,165,250,.14);color:#9cc3ff;border-color:rgba(96,165,250,.35);box-shadow:0 0 10px rgba(96,165,250,.25)}
.b-limite{background:rgba(251,191,36,.12);color:#fcd34d;border-color:rgba(251,191,36,.3)}
.b-normal{background:rgba(52,211,153,.12);color:#6ee7b7;border-color:rgba(52,211,153,.28)}
.b-info{background:rgba(255,255,255,.06);color:var(--mut)}

/* ---------- Détail paramètre ---------- */
.card{padding:16px;margin-bottom:12px}
.bigval{font-size:44px;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05;display:inline-block;
  background:linear-gradient(180deg,#fff,#c9f3ec);-webkit-background-clip:text;background-clip:text;color:transparent}
.bigval small{font-size:16px;font-weight:500;-webkit-text-fill-color:var(--mut)}
.m-title{view-transition-name:m-title;display:inline-block}
.m-val{view-transition-name:m-val}
.ptitle{font-size:20px;font-weight:750;margin:2px 0 6px}
.muted{color:var(--mut)}
.small{font-size:13px}
.obs{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;margin-top:12px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s .25s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dotp{transform-box:fill-box;transform-origin:center;animation:popDot .5s var(--spring) both}
@keyframes popDot{from{transform:scale(0)}to{transform:scale(1)}}
.areaf{opacity:0;animation:fadeIn .8s .9s forwards}
@keyframes fadeIn{to{opacity:1}}

/* ---------- Boutons / formulaires ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:16px;padding:12px 16px;cursor:pointer;font-weight:700;transition:transform .2s var(--spring),box-shadow .3s}
.btn:active{transform:scale(.95)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#03201b;box-shadow:0 8px 24px rgba(46,230,197,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.danger{color:var(--hi);border-color:rgba(255,107,129,.35)}
.btn.block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.btn-row .btn{flex:1}
label.f{display:block;font-size:11px;color:var(--mut);margin:0 0 5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.in{width:100%;border:1px solid var(--line);background:rgba(0,0,0,.22);border-radius:12px;padding:11px 12px;outline:0;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(46,230,197,.18),0 0 16px rgba(46,230,197,.25)}
select.in option{background:#0b1524}
textarea.in{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mb{margin-bottom:10px}
.frow{padding:14px;margin-bottom:10px;position:relative;animation:pop3d .5s var(--ease) both}
.frow .rm{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:10px;border:1px solid rgba(255,107,129,.35);background:rgba(255,107,129,.12);color:var(--hi);cursor:pointer;font-weight:800}
.frow .num{font-size:11px;font-weight:800;color:var(--acc);margin-bottom:10px;letter-spacing:.12em;text-transform:uppercase}
.frow .live{font-size:12px;margin-top:8px;min-height:18px}
details.paste summary{cursor:pointer;font-weight:700;color:var(--acc);padding:2px 0;list-style:none}
@keyframes pop3d{from{opacity:0;transform:perspective(800px) translateY(24px) rotateX(-25deg) scale(.96)}to{opacity:1;transform:none}}

/* ---------- Bilans ---------- */
.bcard{display:flex;gap:14px;align-items:center;padding:14px;margin-bottom:12px;animation:pop3d .6s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
.date-box{flex:none;width:58px;text-align:center;border-radius:16px;padding:8px 0;line-height:1.05;background:linear-gradient(160deg,rgba(46,230,197,.22),rgba(56,189,248,.10));border:1px solid rgba(46,230,197,.35);box-shadow:0 0 18px rgba(46,230,197,.2)}
.date-box b{display:block;font-size:22px}
.date-box span{font-size:10px;text-transform:uppercase;color:var(--mut)}
table.res{width:100%;border-collapse:collapse;font-size:13px}
table.res td{padding:10px 4px;border-top:1px solid var(--line);vertical-align:top}
table.res tr:first-child td{border-top:0}
table.res td.v{text-align:right;white-space:nowrap;font-weight:800}
.empty{text-align:center;color:var(--mut);padding:50px 10px}
.empty .emo{font-size:54px;display:block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-6deg)}}
.foot{font-size:11.5px;color:var(--mut);text-align:center;margin:22px 8px}

/* ---------- Dock (Glassy Navigation Tabs) ---------- */
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;width:min(520px,calc(100% - 24px));height:70px;
  display:flex;align-items:stretch;border-radius:28px;view-transition-name:dock;
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.25),0 18px 40px rgba(0,0,0,.55)}
.ind{position:absolute;top:0;bottom:0;left:0;width:20%;transform:translateX(calc(var(--x,0)*100%));transition:transform .6s var(--spring);pointer-events:none}
.ind::before{content:"";position:absolute;top:-1px;left:50%;width:34px;height:3px;margin-left:-17px;border-radius:0 0 4px 4px;background:var(--acc);box-shadow:0 0 10px var(--acc),0 0 22px var(--acc),0 0 40px rgba(46,230,197,.6)}
.ind::after{content:"";position:absolute;top:2px;left:50%;width:70px;height:60px;margin-left:-35px;background:linear-gradient(180deg,rgba(46,230,197,.38),rgba(46,230,197,0));clip-path:polygon(32% 0,68% 0,100% 100%,0 100%);filter:blur(2px)}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:rgba(234,246,247,.55);cursor:pointer;position:relative;transition:color .3s,transform .3s var(--spring)}
.tab svg{width:23px;height:23px;transition:transform .45s var(--spring),filter .3s}
.tab.on{color:#dffdf6}
.tab.on svg{transform:translateY(-2px) scale(1.12);filter:drop-shadow(0 0 6px rgba(46,230,197,.9));color:var(--acc)}
.tab:active svg{transform:scale(.8)}
.tab .plus{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;margin-top:-4px;
  background:radial-gradient(circle at 50% 30%,rgba(46,230,197,.35),rgba(46,230,197,.08));border:1px solid rgba(46,230,197,.55);
  box-shadow:0 0 0 0 rgba(46,230,197,.5),0 0 18px rgba(46,230,197,.45);animation:pulse 2.6s infinite}
.tab .plus svg{width:22px;height:22px;color:#c9fff4}
.tab.create.on .plus{background:linear-gradient(135deg,var(--acc),var(--acc2));transform:rotate(45deg);transition:transform .5s var(--spring)}
.tab.create.on .plus svg{color:#03201b;filter:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,230,197,.45),0 0 18px rgba(46,230,197,.45)}70%{box-shadow:0 0 0 14px rgba(46,230,197,0),0 0 18px rgba(46,230,197,.45)}100%{box-shadow:0 0 0 0 rgba(46,230,197,0),0 0 18px rgba(46,230,197,.45)}}
.dot{position:absolute;top:10px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--hi);color:#fff;font-size:10px;font-weight:800;font-style:normal;display:grid;place-items:center;box-shadow:0 0 10px rgba(255,107,129,.8)}
.dot:empty{display:none}

/* ---------- Feuille "Plus" ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(3px)}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:41;width:min(640px,100%);padding:10px 16px calc(22px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;
  transform:translate(-50%,105%) perspective(900px) rotateX(20deg);transform-origin:bottom;transition:transform .5s var(--spring);background:linear-gradient(180deg,rgba(20,32,46,.92),rgba(10,18,30,.96))}
.sheet.open{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.25);margin:0 auto 14px}
.sheet .item{display:flex;gap:14px;align-items:center;width:100%;border:0;background:none;padding:13px 6px;border-top:1px solid var(--line);text-align:left;cursor:pointer;border-radius:12px;transition:background .2s}
.sheet .item:first-of-type{border-top:0}
.sheet .item:active{background:rgba(255,255,255,.06)}
.sheet .item .e{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:18px}
.sheet .item small{display:block;color:var(--mut);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px) scale(.9);padding:11px 18px;border-radius:16px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.35s var(--spring);z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.cf{position:fixed;width:9px;height:14px;border-radius:3px;z-index:60;pointer-events:none}

.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.9);display:none;place-items:center;padding:16px}
.lightbox.on{display:grid}
.lightbox img{max-width:100%;max-height:88vh;border-radius:12px;animation:pop3d .4s var(--ease)}
.modal{position:fixed;inset:0;z-index:65;display:none;place-items:center;padding:18px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal.on{display:grid}
.modal .box{width:min(460px,100%);padding:18px;animation:pop3d .45s var(--ease);background:linear-gradient(180deg,rgba(20,32,46,.95),rgba(10,18,30,.97))}

/* ---------- Connexion ---------- */
.login{position:fixed;inset:0;z-index:80;display:none;overflow-y:auto;perspective:1200px}
body.locked .login{display:block}
body.locked .app,body.locked .dock{display:none}
.login.leaving .lg-in{animation:lgOut .42s var(--ease) forwards}
@keyframes lgOut{to{opacity:0;transform:translateZ(260px) scale(1.15);filter:blur(8px)}}
.lg-in{min-height:100%;max-width:460px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top)) 22px 30px;display:flex;flex-direction:column;align-items:center;text-align:center;animation:pop3d .6s var(--ease) both}
.lg-logo{width:74px;height:74px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#03201b;box-shadow:0 0 40px rgba(46,230,197,.5);margin-bottom:16px;animation:bob 3s ease-in-out infinite}
.lg-logo svg{width:40px;height:40px}
.lg-h{margin:0 0 4px;font-size:30px;letter-spacing:-.02em;background:linear-gradient(90deg,#fff,#bff7ec 60%,#9fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.profiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
.profile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 10px 16px;cursor:pointer;border-radius:26px;animation:cardIn .7s var(--spring) both;animation-delay:calc(var(--i)*120ms + 150ms);transition:transform .35s var(--spring)}
.profile:active{transform:scale(.94)}
.profile.chosen{transform:perspective(800px) rotateY(180deg) scale(.9);opacity:.4;transition:all .3s ease-in}
@keyframes cardIn{from{opacity:0;transform:perspective(800px) rotateY(-70deg) translateY(30px)}to{opacity:1;transform:none}}
.profile b{font-size:17px}
.profile small{color:var(--mut);font-size:12px;letter-spacing:.08em}
.profile em{font-style:normal;font-size:11px;margin-top:6px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--mut)}
.pav{width:72px;height:72px;border-radius:24px;display:grid;place-items:center;font-weight:900;font-size:24px;color:#0a1420;margin-bottom:6px}
.pav.big{width:84px;height:84px;font-size:28px;border-radius:28px;animation:popDot .6s var(--spring) both}
.pad-in{position:relative}
.lg-back{position:absolute;left:16px;top:calc(14px + env(safe-area-inset-top));border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:12px;padding:7px 12px;cursor:pointer;font-weight:600}
.lg-name{margin:6px 0 18px;font-size:20px}
.lg-t{font-weight:800;font-size:17px}
.dots{display:flex;gap:14px;margin:22px 0 8px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.35);transition:all .25s var(--spring)}
.dots i.on{background:var(--acc);border-color:var(--acc);box-shadow:0 0 14px var(--acc);transform:scale(1.15)}
.dots.ok i{background:var(--ok);border-color:var(--ok);box-shadow:0 0 16px var(--ok)}
.dots.shake{animation:shake .45s}
.dots.shake i{border-color:var(--hi)}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.lg-msg{min-height:20px;font-size:13px;color:#ff9aab;margin-bottom:8px}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 26px;justify-content:center;margin-top:4px}
.key{width:76px;height:76px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:26px;font-weight:600;cursor:pointer;transition:transform .15s var(--spring),background .15s,box-shadow .2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.key:active{transform:scale(.88);background:rgba(46,230,197,.25);box-shadow:0 0 22px rgba(46,230,197,.5)}
.key.ghost{background:none;border:0;box-shadow:none;font-size:15px;color:var(--mut);backdrop-filter:none}
.key.ghost[data-k=del]{font-size:24px}
@media (max-height:700px){.keypad{grid-template-columns:repeat(3,64px);gap:12px 22px}.key{width:64px;height:64px;font-size:22px}.lg-in{padding-top:26px}}

/* ---------- Sync / formulaires connexion ---------- */
.avwrap{position:relative;cursor:pointer}
.sync{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;border:2.5px solid #08111d;background:#64748b;transition:background .3s}
.sync.ok{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.sync.wait{background:var(--lim);box-shadow:0 0 10px var(--lim);animation:blink 1s infinite}
.sync.off{background:#94a3b8}
@keyframes blink{50%{opacity:.35}}
.lg-form{width:100%;padding:18px;text-align:left;margin-top:4px}
.modal{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:18px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal.on{display:grid}
.modal .box{width:min(460px,100%);padding:18px;animation:pop3d .45s var(--ease);background:linear-gradient(180deg,rgba(20,32,46,.96),rgba(10,18,30,.98))}

/* ---------- 3D tilt ---------- */
.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s ease-out;transform-style:preserve-3d}

/* ---------- Transitions 3D (View Transitions API) ---------- */
#view{view-transition-name:page}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-group(page){animation-duration:.6s;animation-timing-function:var(--ease)}
::view-transition-group(m-title),::view-transition-group(m-val){animation-duration:.6s;animation-timing-function:cubic-bezier(.3,1.25,.4,1)}
::view-transition-old(page),::view-transition-new(page){animation-duration:.6s;animation-timing-function:var(--ease);animation-fill-mode:both;backface-visibility:hidden}
html[data-dir=right]::view-transition-old(page){animation-name:outL}
html[data-dir=right]::view-transition-new(page){animation-name:inR}
html[data-dir=left]::view-transition-old(page){animation-name:outR}
html[data-dir=left]::view-transition-new(page){animation-name:inL}
html[data-dir=fwd]::view-transition-old(page){animation-name:sinkBack}
html[data-dir=fwd]::view-transition-new(page){animation-name:riseFront}
html[data-dir=back]::view-transition-old(page){animation-name:dropFront}
html[data-dir=back]::view-transition-new(page){animation-name:riseBack}
html[data-dir=fade]::view-transition-old(page){animation-name:flipOut}
html[data-dir=fade]::view-transition-new(page){animation-name:flipIn}
@keyframes outL{to{opacity:0;transform:perspective(1100px) translateX(-38%) rotateY(62deg) scale(.82)}}
@keyframes inR{from{opacity:0;transform:perspective(1100px) translateX(38%) rotateY(-62deg) scale(.82)}}
@keyframes outR{to{opacity:0;transform:perspective(1100px) translateX(38%) rotateY(-62deg) scale(.82)}}
@keyframes inL{from{opacity:0;transform:perspective(1100px) translateX(-38%) rotateY(62deg) scale(.82)}}
@keyframes sinkBack{to{opacity:0;transform:perspective(1100px) translateZ(-320px) rotateX(14deg);filter:blur(6px)}}
@keyframes riseFront{from{opacity:0;transform:perspective(1100px) translateY(90px) rotateX(-28deg) scale(1.06)}}
@keyframes dropFront{to{opacity:0;transform:perspective(1100px) translateY(110px) rotateX(-28deg) scale(1.04)}}
@keyframes riseBack{from{opacity:0;transform:perspective(1100px) translateZ(-320px) rotateX(14deg);filter:blur(6px)}}
@keyframes flipOut{to{opacity:0;transform:perspective(1100px) rotateY(-90deg) scale(.9)}}
@keyframes flipIn{from{opacity:0;transform:perspective(1100px) rotateY(90deg) scale(.9)}}
/* Repli si l'API n'existe pas */
#view.enter[data-dir=right]{animation:inR .55s var(--ease) both}
#view.enter[data-dir=left]{animation:inL .55s var(--ease) both}
#view.enter[data-dir=fwd]{animation:riseFront .55s var(--ease) both}
#view.enter[data-dir=back]{animation:riseBack .55s var(--ease) both}
#view.enter[data-dir=fade]{animation:flipIn .55s var(--ease) both}

@media (max-width:420px){.grid4{grid-template-columns:1fr 1fr}.ring{width:96px;height:96px}.ring-txt b{font-size:24px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
@media print{.bg,.dock,.topbar .icon-btn,.btn-row,.search,.chips,.avatar{display:none!important}html,body{background:#fff;color:#000}.glass{background:#fff;box-shadow:none;backdrop-filter:none;border-color:#ccc}.bigval,.topbar h1{-webkit-text-fill-color:#000;color:#000}*{animation:none!important}}
</style>
</head>
<body>
<div class="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><div class="gridfx"></div></div>

<div class="app">
  <header class="topbar" id="topbar">
    <button class="icon-btn back glass" id="backBtn" aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="grow"><div class="kicker" id="kicker">Mon dossier médical</div><h1 id="title">Ma santé</h1></div>
    <div class="avwrap" id="avwrap"><div class="avatar" id="avatar">P</div><i class="sync" id="sync"></i></div>
  </header>
  <main id="view"></main>
</div>

<nav class="dock" id="dock">
  <div class="ind" id="ind"></div>
  <button class="tab" data-go="#/registre" data-i="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg>Accueil</button>
  <button class="tab" data-go="#/alertes" data-i="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg><i class="dot" id="alertDot"></i>Alertes</button>
  <button class="tab create" data-go="#/ajouter" data-i="2" aria-label="Enregistrer un résultat"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Ajouter</button>
  <button class="tab" data-go="#/bilans" data-i="3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>Bilans</button>
  <button class="tab" id="moreTab" data-i="4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>Plus</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet glass" id="sheet">
  <div class="grab"></div>
  <div id="sheetUser" style="display:flex;align-items:center;gap:12px;padding:2px 6px 12px"></div>
  <button class="item" data-act="install"><span class="e">📲</span><span>Installer sur l'écran d'accueil<small>Utiliser comme une vraie appli</small></span></button>
  <button class="item" data-act="export"><span class="e">⬇️</span><span>Exporter mes données<small>Sauvegarde .json à garder en lieu sûr</small></span></button>
  <button class="item" data-act="import"><span class="e">⬆️</span><span>Importer une sauvegarde<small>Remplace les données de ton profil</small></span></button>

<div class="modal" id="pwModal"><div class="box glass">
  <div class="lg-t" style="text-align:left">🔐 Nouveau mot de passe</div>
  <p class="small muted">Mot de passe du dossier : il sert à te connecter sur un nouveau téléphone. Ton dossier est rechiffré avec lui. 8 caractères minimum.</p>
  <div class="mb"><label class="f">Nouveau mot de passe</label><input class="in" id="pw1" type="password" autocomplete="new-password"></div>
  <div class="mb"><label class="f">Confirmer</label><input class="in" id="pw2" type="password" autocomplete="new-password"></div>
  <div class="lg-msg" id="pwMsg" style="text-align:left"></div>

</div></div>

<script>
/* ============ DONNÉES INITIALES ============ */


/* ============ STOCKAGE ============ */
/* ============ STOCKAGE EN LIGNE : dépôt GitHub privé ============
   Les dossiers sont enregistrés (chiffrés) dans un dépôt PRIVÉ, un fichier par personne.
   Si l'appli est publiée sur <compte>.github.io, le compte est détecté tout seul. */
const GH_OWNER = '';                    // laisser vide = détecté depuis l'adresse <compte>.github.io
const GH_REPO  = 'dossier-sante-data';  // nom du dépôt privé des données

const KEY='dossier-sante-v1';
let db=null, user=null, dek=null;
const USERS=[
  {id:'mathieu',name:'Mathieu ZANGRE',first:'Mathieu',ini:'MZ',g:'linear-gradient(135deg,#2ee6c5,#38bdf8)',glow:'rgba(46,230,197,.55)'},
  {id:'ines',name:'Ines ZIGANE',first:'Ines',ini:'IZ',g:'linear-gradient(135deg,#f472b6,#a78bfa)',glow:'rgba(244,114,182,.55)'}
];
const cfgGH=()=>{
  let c={}; try{ c=JSON.parse(localStorage.getItem('ds-gh'))||{}; }catch(e){}
  const auto=location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:'';
  const owner=(GH_OWNER||c.owner||auto).trim(), repo=(c.repo||GH_REPO).trim();
  return owner&&repo?{owner,repo}:null;
};

/* ---------- Chiffrement (AES-GCM 256, clés dérivées PBKDF2) ---------- */
const te=new TextEncoder(),td=new TextDecoder();
const toB64=buf=>{ const u=new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); };
const fromB64=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const rand=n=>crypto.getRandomValues(new Uint8Array(n));
async function pbk(secret,salt){ const base=await crypto.subtle.importKey('raw',te.encode(secret),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
async function encRaw(key,bytes){ const iv=rand(12); return {iv:toB64(iv),ct:toB64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes))}; }
async function decRaw(key,o){ return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(o.iv)},key,fromB64(o.ct))); }
const encJSON=(key,obj)=>encRaw(key,te.encode(JSON.stringify(obj)));
const decJSON=async(key,o)=>JSON.parse(td.decode(await decRaw(key,o)));
const newDEK=()=>crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);
const rawDEK=async k=>new Uint8Array(await crypto.subtle.exportKey('raw',k));
const importDEK=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt']);

/* ---------- Appareil : code rapide + jeton + cache chiffrés ---------- */
const DEV=id=>'ds-dev-'+id;
const getDev=id=>{ try{ return JSON.parse(localStorage.getItem(DEV(id))); }catch(e){ return null; } };
const setDev=(id,o)=>localStorage.setItem(DEV(id),JSON.stringify(o));

/* ---------- API GitHub (Contents) ---------- */
const G={tok:null};
async function gh(path,opt={}){
  const c=cfgGH(); if(!c) throw new Error('Dépôt GitHub non configuré');
  let r;
  try{ r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}${path}`,{method:opt.method||'GET',cache:'no-store',
      headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+G.tok,'X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})},body:opt.body}); }
  catch(e){ const er=new Error('Pas de connexion internet'); er.offline=true; throw er; }
  if(!r.ok){ let m=''; try{ m=(await r.json()).message||''; }catch(e){}
    const er=new Error(r.status===401?'Jeton GitHub invalide ou expiré':r.status===403?'Jeton sans droit d\'écriture sur le dépôt (Contents : Read and write)':r.status===404?'Introuvable':(m||'Erreur GitHub '+r.status));
    er.status=r.status; throw er; }
  return r.status===204?null:r.json();
}
const fileOf=id=>`/contents/${id}.json`;
async function checkRepo(){ try{ await gh(''); }catch(e){ if(e.status===404){ const c=cfgGH(); throw new Error(`Dépôt ${c.owner}/${c.repo} introuvable, ou le jeton n'y a pas accès`); } throw e; } }
async function getFile(id){ try{ const j=await gh(fileOf(id)); return {sha:j.sha,row:JSON.parse(atob(j.content.replace(/\n/g,'')))}; }catch(e){ if(e.status===404) return null; throw e; } }
async function putFile(id,row,sha){
  const j=await gh(fileOf(id),{method:'PUT',body:JSON.stringify({message:'Mise à jour '+id+' — '+new Date().toISOString().slice(0,16).replace('T',' '),content:btoa(JSON.stringify(row)),...(sha?{sha}:{})})});
  return j.content.sha;
}

/* ---------- Indicateur de synchronisation ---------- */
function setSync(st){ const el=$('#sync'); if(!el) return; el.className='sync '+st;
  el.title={ok:'Synchronisé',wait:'Synchronisation…',off:'Hors ligne — sera envoyé plus tard'}[st]||''; }

/* ---------- Enregistrement : cache chiffré local + envoi sur GitHub ---------- */
let saveChain=Promise.resolve();
function save(){
  if(!user||!dek) return; const snap=structuredClone(db),u=user.id;
  setSync('wait');
  saveChain=saveChain.then(async()=>{
    const e=await encJSON(dek,snap), d=getDev(u); if(!d) return;
    d.cache={...e,updated_at:new Date().toISOString()}; d.dirty=true; setDev(u,d);
    if(user&&user.id===u) await pushData();
  }).catch(err=>{ console.error(err); toast('⚠️ Enregistrement impossible — exporte tes données'); });
}
async function pushData(){
  const u=user&&user.id, d=u&&getDev(u); if(!d||!d.dirty){ setSync('ok'); return; }
  try{
    const cur=await getFile(u);
    const row={...(cur?cur.row:d.wrap),v:1,data_iv:d.cache.iv,data_ct:d.cache.ct,updated_at:d.cache.updated_at};
    const sha=await putFile(u,row,cur&&cur.sha);
    const d2=getDev(u); d2.sha=sha; if(d2.cache.updated_at===d.cache.updated_at) d2.dirty=false; setDev(u,d2);
    setSync(d2.dirty?'wait':'ok');
  }catch(e){ setSync('off'); if(!e.offline) console.warn(e); }
}
/* Récupère la version en ligne si elle a été modifiée ailleurs */
async function pull(){
  if(!user||!dek) return false;
  try{
    const d=getDev(user.id); if(!d) return false;
    if(d.dirty){ await pushData(); return false; }
    const f=await getFile(user.id); if(!f){ setSync('ok'); return false; }
    if(f.sha!==d.sha&&f.row.data_ct!==d.cache.ct){
      db=await decJSON(dek,{iv:f.row.data_iv,ct:f.row.data_ct});
      d.cache={iv:f.row.data_iv,ct:f.row.data_ct,updated_at:f.row.updated_at}; d.sha=f.sha; setDev(user.id,d); setSync('ok'); return true;
    }
    d.sha=f.sha; setDev(user.id,d); setSync('ok'); return false;
  }catch(e){ setSync('off'); return false; }
}
window.addEventListener('online',()=>{ if(user) pushData(); });

/* Pièces jointes (photos / PDF) dans IndexedDB */
const IDB={
  _d:null,
  open(){ return this._d||(this._d=new Promise((res,rej)=>{ const r=indexedDB.open('dossier-sante',1); r.onupgradeneeded=()=>r.result.createObjectStore('pj',{keyPath:'id'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); },
  async tx(mode,fn){ const d=await this.open(); return new Promise((res,rej)=>{ const t=d.transaction('pj',mode); const q=fn(t.objectStore('pj')); t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); }); },
  put(o){ return this.tx('readwrite',s=>s.put(o)); }, get(id){ return this.tx('readonly',s=>s.get(id)); },
  del(id){ return this.tx('readwrite',s=>s.delete(id)); }, all(){ return this.tx('readonly',s=>s.getAll()); }, clear(){ return this.tx('readwrite',s=>s.clear()); }
};

/* ============ OUTILS ============ */
const CATS=['Biochimie','Hématologie','Hormonologie','Sérologie','Immunologie','Urines','Constantes','Imagerie','Autre'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{ if(v===null||v===undefined||v==='') return NaN; return parseFloat(String(v).replace(/\s/g,'').replace(',','.')); };
const nOrNull=v=>{ const n=num(v); return isNaN(n)?null:n; };
const fmtN=n=>n==null?'':String(n).replace('.',',');
const keyOf=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%]+/g,' ').trim();
const uid=()=>'b-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=(d,o={day:'2-digit',month:'short',year:'numeric'})=>{ try{return new Date(d+'T00:00:00').toLocaleDateString('fr-FR',o);}catch(e){return d;} };
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const buzz=(ms=8)=>{ try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){} };
function refTxt(r){ const a=r.min,b=r.max; if(a!=null&&b!=null) return `Réf. ${fmtN(a)}–${fmtN(b)}`; if(b!=null) return `Réf. ≤ ${fmtN(b)}`; if(a!=null) return `Réf. ≥ ${fmtN(a)}`; return 'Sans valeur de référence'; }
function status(r){
  const v=num(r.val),a=r.min,b=r.max;
  if(isNaN(v)||(a==null&&b==null)) return 'info';
  if(a!=null&&v<a) return 'bas';
  if(b!=null&&v>b) return 'haut';
  if(a!=null&&b!=null){ const m=(b-a)*0.05; if(v-a<=m||b-v<=m) return 'limite'; }
  return 'normal';
}
const LBL={haut:'↑ Élevé',bas:'↓ Bas',limite:'≈ Limite',normal:'Normal',info:'Info'};
const badge=s=>`<span class="badge b-${s}">${LBL[s]}</span>`;
const abbr=s=>{ const w=String(s).split(/[\s/()-]+/).filter(Boolean); return (w.length>1?w.map(x=>x[0]).join(''):w[0]?.slice(0,3)||'?').slice(0,3).toUpperCase(); };
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2300); }
const sortedBilans=()=>[...db.bilans].sort((a,b)=>b.date.localeCompare(a.date));

function registre(){
  const m=new Map();
  for(const b of [...db.bilans].sort((a,b)=>a.date.localeCompare(b.date))) for(const r of b.resultats){
    const k=keyOf(r.param); if(!k) continue;
    if(!m.has(k)) m.set(k,{key:k,hist:[]});
    m.get(k).hist.push({...r,date:b.date,bid:b.id,titre:b.titre});
  }
  for(const p of m.values()){ p.hist.sort((a,b)=>a.date.localeCompare(b.date)); p.last=p.hist[p.hist.length-1]; p.param=p.last.param; p.cat=p.last.cat||'Autre'; p.st=status(p.last); }
  return m;
}
function spark(p){
  const v=p.hist.map(h=>num(h.val)).filter(x=>!isNaN(x)); if(v.length<2) return '';
  const mn=Math.min(...v),mx=Math.max(...v),W=46,H=18;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}"><polyline points="${v.map((x,i)=>`${(i/(v.length-1)*W).toFixed(1)},${(H-2-(mx===mn?.5:(x-mn)/(mx-mn))*(H-4)).toFixed(1)}`).join(' ')}"/></svg>`;
}
function rowP(p,i){
  return `<a class="row" data-key="${esc(p.key)}" href="#/param/${encodeURIComponent(p.key)}" style="--i:${i}">
    <div class="ic ic-${p.st}">${esc(abbr(p.param))}</div>
    <div class="row-main"><div class="row-name">${esc(p.param)}</div><div class="row-sub">${esc(refTxt(p.last))}${p.last.unit&&(p.last.min!=null||p.last.max!=null)?' '+esc(p.last.unit):''} · ${fmtDate(p.last.date)}</div></div>
    ${spark(p)}
    <div class="row-val"><div class="val">${esc(p.last.val)} <small>${esc(p.last.unit)}</small></div><br>${badge(p.st)}</div>
  </a>`;
}

/* ============ EN-TÊTE / ANIMATIONS ============ */
let lastKey=null;
const ui={filter:'Tous',q:'',dir:'fade'};
function setHeader(title,kicker,back){
  $('#title').textContent=title; $('#kicker').textContent=kicker||'Mon dossier médical';
  $('#topbar').classList.toggle('has-back',!!back); $('#avwrap').style.display=back?'none':'block';
  if(user){ const a=$('#avatar'); a.textContent=user.ini; a.style.background=user.g; a.style.boxShadow='0 0 18px '+user.glow; }
  $('#backBtn').onclick=()=>{ buzz(); if(navDepth>0) history.back(); else location.hash=back; };
}
function countUp(el){
  const end=parseFloat(el.dataset.count); if(REDUCE){ el.textContent=end; return; }
  const t0=performance.now(),d=1100;
  const step=t=>{ const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3); el.textContent=Math.round(end*e); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function afterRender(){
  document.querySelectorAll('[data-count]').forEach(countUp);
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.ring-fg').forEach(c=>c.style.strokeDashoffset=c.dataset.off)));
  const n=[...registre().values()].filter(p=>p.st==='haut'||p.st==='bas').length;
  $('#alertDot').textContent=n||'';
}
function ring(pct){
  const C=2*Math.PI*40;
  return `<div class="ring"><svg viewBox="0 0 100 100"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ee6c5"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>
    <circle cx="50" cy="50" r="40" class="ring-bg"/><circle cx="50" cy="50" r="40" class="ring-fg" stroke="url(#rg)" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C*(1-pct/100)}"/></svg>
    <div class="ring-txt"><div><b data-count="${pct}">0</b><small>%</small></div><span>dans la norme</span></div></div>`;
}
function setMorph(row){
  document.querySelectorAll('.row [style*="view-transition-name"]').forEach(e=>e.style.viewTransitionName='');
  if(!row) return;
  row.querySelector('.row-name').style.viewTransitionName='m-title';
  row.querySelector('.val').style.viewTransitionName='m-val';
}
function morphBack(){
  if(ui.dir!=='back'||!lastKey) return;
  const r=document.querySelector(`.row[data-key="${CSS.escape(lastKey)}"]`);
  if(r){ const b=r.getBoundingClientRect(); if(b.top<innerHeight&&b.bottom>0) setMorph(r); }
}

/* ============ VUES ============ */
function vRegistre(){
  setHeader('Ma santé','Bonjour '+user.first+' 👋',false);
  const R=[...registre().values()];
  if(!R.length){ $('#view').innerHTML=`<div class="card glass tilt" id="hero" style="text-align:center;padding:34px 18px">
      <span class="emo" style="font-size:58px;display:block;animation:bob 2.4s ease-in-out infinite">🩺</span>
      <h2 style="margin:10px 0 6px">Bienvenue ${esc(user.first)} !</h2>
      <p class="muted small">Ton registre santé est vide pour l'instant.<br>Ajoute ton premier bilan pour le voir apparaître ici.</p>
      <div class="btn-row"><a class="btn primary" href="#/ajouter">＋ Ajouter mon premier bilan</a></div></div>
      <p class="foot">🔒 Chiffré de bout en bout · ☁️ synchronisé en ligne</p>`; return; }
  const out=R.filter(p=>p.st==='haut'||p.st==='bas');
  const withRef=R.filter(p=>p.st!=='info');
  const pct=withRef.length?Math.round(withRef.filter(p=>p.st==='normal'||p.st==='limite').length/withRef.length*100):100;
  const last=sortedBilans()[0];
  const cats=[...new Set(R.map(p=>p.cat))];
  $('#view').innerHTML=`
    <div class="hero glass tilt" id="hero">
      ${ring(pct)}
      <div style="min-width:0">
        <h2>${out.length?out.length+' valeur'+(out.length>1?'s':'')+' hors référence':'Tout est dans les valeurs de référence ✨'}</h2>
        <p>Dernier bilan · ${last?fmtDate(last.date,{day:'numeric',month:'long',year:'numeric'}):'—'}</p>
        <div class="pills">${out.slice(0,6).map(p=>`<a class="pill ${p.st}" href="#/param/${encodeURIComponent(p.key)}">${esc(p.param.split(' /')[0])} ${p.st==='haut'?'↑':'↓'}</a>`).join('')}${out.length>6?`<a class="pill" href="#/alertes">+${out.length-6}</a>`:''}</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat glass" style="--i:0;--c:var(--acc)"><b data-count="${R.length}">0</b><span>Paramètres</span></div>
      <div class="stat glass" style="--i:1;--c:var(--hi)"><b data-count="${out.length}">0</b><span>Hors norme</span></div>
      <div class="stat glass" style="--i:2;--c:var(--acc3)"><b data-count="${db.bilans.length}">0</b><span>Bilan${db.bilans.length>1?'s':''}</span></div>
    </div>
    <div class="search glass"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" opacity=".55"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Rechercher un paramètre…" value="${esc(ui.q)}"></div>
    <div class="chips" id="chips">${['Tous','Hors norme',...cats].map(c=>`<button class="chip ${ui.filter===c?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div id="list"></div>
    <p class="foot">🔒 Chiffré de bout en bout · ☁️ synchronisé en ligne<br>Ce registre ne remplace pas l'avis d'un médecin.</p>`;
  const draw=()=>{
    const q=keyOf(ui.q);
    let L=R.filter(p=>!q||p.key.includes(q));
    if(ui.filter==='Hors norme') L=L.filter(p=>p.st!=='normal'&&p.st!=='info');
    else if(ui.filter!=='Tous') L=L.filter(p=>p.cat===ui.filter);
    if(!L.length){ $('#list').innerHTML='<div class="empty"><span class="emo">🔎</span>Aucun résultat</div>'; return; }
    const g={}; L.forEach(p=>(g[p.cat]=g[p.cat]||[]).push(p));
    let i=0;
    $('#list').innerHTML=Object.entries(g).map(([c,ps])=>`<div class="group-title">${esc(c)} · ${ps.length}</div><div class="list glass">${ps.map(p=>rowP(p,i++)).join('')}</div>`).join('');
  };
  draw(); morphBack();
  $('#q').oninput=e=>{ ui.q=e.target.value; draw(); };
  $('#chips').onclick=e=>{ const b=e.target.closest('.chip'); if(!b) return; buzz(); ui.filter=b.dataset.c; document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b)); draw(); };
}

function vAlertes(){
  setHeader('Alertes','Hors valeurs de référence',false);
  const R=[...registre().values()];
  const sets=[['haut','Au-dessus de la référence'],['bas','En dessous de la référence'],['limite','Proches d\'une limite']];
  const total=R.filter(p=>p.st==='haut'||p.st==='bas').length;
  let i=0;
  $('#view').innerHTML= total||R.some(p=>p.st==='limite') ? `
    <div class="stats">
      <div class="stat glass" style="--i:0;--c:var(--hi)"><b data-count="${R.filter(p=>p.st==='haut').length}">0</b><span>Élevés</span></div>
      <div class="stat glass" style="--i:1;--c:var(--lo)"><b data-count="${R.filter(p=>p.st==='bas').length}">0</b><span>Bas</span></div>
      <div class="stat glass" style="--i:2;--c:var(--lim)"><b data-count="${R.filter(p=>p.st==='limite').length}">0</b><span>Limites</span></div>
    </div>
    ${sets.map(([s,t])=>{ const L=R.filter(p=>p.st===s); return L.length?`<div class="group-title">${t}</div><div class="list glass">${L.map(p=>rowP(p,i++)).join('')}</div>`:''; }).join('')}
    <p class="foot">Statuts calculés à partir des valeurs de référence imprimées par le laboratoire.<br>À interpréter avec votre médecin.</p>`
  : `<div class="empty"><span class="emo">🎉</span><b>Aucune alerte</b><br>Tous les paramètres sont dans les valeurs de référence.</div>`;
  morphBack();
}

function chart(p){
  const pts=p.hist.map(h=>({d:h.date,v:num(h.val),h})).filter(x=>!isNaN(x.v));
  if(!pts.length) return '';
  const W=340,H=180,pl=40,pr=14,pt=16,pb=30,lo=p.last.min,hi=p.last.max;
  const vals=pts.map(x=>x.v); if(lo!=null) vals.push(lo); if(hi!=null) vals.push(hi);
  let mn=Math.min(...vals),mx=Math.max(...vals); const pad=((mx-mn)||Math.abs(mx)||1)*.2; mn-=pad; mx+=pad;
  const X=i=>pts.length===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(pts.length-1);
  const Y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
  const col={haut:'#ff6b81',bas:'#60a5fa',limite:'#fbbf24',normal:'#34d399',info:'#94a3b8'};
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}"><defs>
    <filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2ee6c5" stop-opacity=".35"/><stop offset="1" stop-color="#2ee6c5" stop-opacity="0"/></linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2ee6c5"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>`;
  if(lo!=null||hi!=null){ const y1=Y(hi??mx),y2=Y(lo??mn); s+=`<rect x="${pl}" y="${y1}" width="${W-pl-pr}" height="${Math.max(0,y2-y1)}" fill="rgba(52,211,153,.10)" stroke="rgba(52,211,153,.25)" rx="8"/>`; }
  [lo,hi].forEach(v=>{ if(v!=null) s+=`<text x="${pl-7}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="rgba(226,240,242,.6)">${fmtN(v)}</text>`; });
  if(pts.length>1){
    const line=pts.map((x,i)=>`${X(i)},${Y(x.v)}`).join(' L');
    s+=`<path class="areaf" d="M${X(0)},${H-pb} L${line} L${X(pts.length-1)},${H-pb} Z" fill="url(#ar)"/>`;
    s+=`<path class="draw" pathLength="1" d="M${line}" fill="none" stroke="url(#ln)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/>`;
  }
  pts.forEach((x,i)=>{ s+=`<circle class="dotp" style="animation-delay:${.3+i*.12}s" cx="${X(i)}" cy="${Y(x.v)}" r="6" fill="${col[status(x.h)]}" stroke="#0b1524" stroke-width="2.5" filter="url(#gl)"/>`; });
  (pts.length<=5?pts.map((_,i)=>i):[0,pts.length-1]).forEach(i=>{ s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="rgba(226,240,242,.6)">${fmtDate(pts[i].d,{day:'2-digit',month:'short',year:'2-digit'})}</text>`; });
  return s+'</svg>';
}

/* ---------- Formulaire ---------- */
function rowHTML(r={}){
  return `<div class="frow glass" style="--i:0">
    <button type="button" class="rm" title="Retirer">×</button>
    <div class="num"></div>
    <div class="grid2 mb">
      <div><label class="f">Paramètre *</label><input class="in" data-f="param" list="dlParams" value="${esc(r.param)}" placeholder="ex. Glycémie"></div>
      <div><label class="f">Catégorie</label><input class="in" data-f="cat" list="dlCats" value="${esc(r.cat||'')}" placeholder="Biochimie…"></div>
    </div>
    <div class="grid4 mb">
      <div><label class="f">Résultat *</label><input class="in" data-f="val" value="${esc(r.val)}" inputmode="decimal" placeholder="0,00"></div>
      <div><label class="f">Unité</label><input class="in" data-f="unit" value="${esc(r.unit)}" placeholder="mmol/L"></div>
      <div><label class="f">Réf. min</label><input class="in" data-f="min" value="${esc(fmtN(r.min))}" inputmode="decimal"></div>
      <div><label class="f">Réf. max</label><input class="in" data-f="max" value="${esc(fmtN(r.max))}" inputmode="decimal"></div>
    </div>
    <div><label class="f">Observation</label><input class="in" data-f="obs" value="${esc(r.obs)}" placeholder="Commentaire du compte rendu…"></div>
    <div class="live"></div>
  </div>`;
}
function readRow(el){ const g=f=>el.querySelector(`[data-f="${f}"]`).value.trim(); return {cat:g('cat')||'Autre',param:g('param'),val:g('val'),unit:g('unit'),min:nOrNull(g('min')),max:nOrNull(g('max')),obs:g('obs')}; }
function parseRef(s){
  s=String(s||'').trim(); if(!s||/^[—–\-]$/.test(s)) return [null,null];
  let m=s.match(/(-?[\d.,]+)\s*[–—\-àa]+\s*(-?[\d.,]+)/); if(m) return [nOrNull(m[1]),nOrNull(m[2])];
  m=s.match(/^[<≤]\s*([\d.,]+)/); if(m) return [null,nOrNull(m[1])];
  m=s.match(/^[>≥]\s*([\d.,]+)/); if(m) return [nOrNull(m[1]),null];
  return [null,null];
}
function parsePaste(txt){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>l.includes('\t')?l.split('\t'):l.split(/\s*;\s*|\s{2,}/))
    .filter(c=>c.length>=3&&!/^cat[ée]gorie$/i.test(c[0].trim()))
    .map(c=>{ const [mn,mx]=parseRef(c[4]); return {cat:(c[0]||'').trim(),param:(c[1]||'').trim(),val:(c[2]||'').trim(),unit:(c[3]||'').trim(),min:mn,max:mx,obs:(c[5]||'').trim()}; })
    .filter(r=>r.param&&r.val);
}
function burst(x,y){
  if(REDUCE) return;
  const cols=['#2ee6c5','#38bdf8','#a78bfa','#fbbf24','#ff6b81'];
  for(let i=0;i<34;i++){
    const s=document.createElement('i'); s.className='cf'; s.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%5]};box-shadow:0 0 8px ${cols[i%5]}`;
    document.body.appendChild(s);
    const a=Math.random()*Math.PI*2,d=90+Math.random()*170;
    s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d-120}px) rotate(${Math.random()*900}deg) scale(.3)`,opacity:0}],
      {duration:900+Math.random()*600,easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=()=>s.remove();
  }
}

async function openPJ(id){
  const o=await IDB.get(id); if(!o) return toast('Document introuvable');
  if(o.type.startsWith('image/')){ const lb=$('#lightbox'); lb.querySelector('img').src=o.data; lb.classList.add('on'); }
  else { const b=await (await fetch(o.data)).blob(); window.open(URL.createObjectURL(b),'_blank'); }
}
function thumbHTML(o,busy){ return o.type.startsWith('image/')?`<div class="thumb ${busy?'busy':''}" data-pj="${o.id}" style="background-image:url('${o.data}')"></div>`:`<div class="thumb pdf ${busy?'busy':''}" data-pj="${o.id}">📄<small>${esc(o.name||'PDF')}</small></div>`; }

  const rows=editing?editing.resultats:[pending||{}];
  pending=null;
  $('#view').innerHTML=`
    <datalist id="dlCats">${CATS.map(c=>`<option value="${c}">`).join('')}</datalist>
    <datalist id="dlParams">${[...R.values()].map(p=>`<option value="${esc(p.param)}">`).join('')}</datalist>
    <div class="card glass" >
      <details class="paste" open><summary>📋 Coller un bilan préparé (texte)</summary>
        <p class="small muted">Colle ici le bloc préparé par Claude (lignes Date:, Labo:, Titre: puis une ligne par résultat). Format : Catégorie ⇥ Paramètre ⇥ Résultat ⇥ Unité ⇥ Valeurs de référence ⇥ Observation (copié depuis Excel ou un tableau).</p>

      <select class="in" id="target"><option value="">✨ Nouveau bilan</option>${sortedBilans().map(b=>`<option value="${b.id}" ${b.id===target?'selected':''}>${fmtDate(b.date)} — ${esc(b.titre||'Bilan')}</option>`).join('')}</select></div>`}
    <div class="card glass" id="bilanFields">
      <div class="grid2 mb">
        <div><label class="f">Date *</label><input class="in" type="date" id="fDate" value="${editing?editing.date:today()}"></div>
        <div><label class="f">Labo / médecin</label><input class="in" id="fLabo" value="${esc(editing?.labo)}" placeholder="ex. Labo XYZ"></div>
      </div>
      <div class="mb"><label class="f">Intitulé</label><input class="in" id="fTitre" value="${esc(editing?.titre||'')}" placeholder="ex. Bilan sanguin de contrôle"></div>
      <div><label class="f">Notes</label><textarea class="in" id="fNotes" placeholder="Contexte, prescription, à jeun…">${esc(editing?.notes)}</textarea></div>
    </div>
    <div class="group-title">Résultats</div>
    <div id="rows">${rows.map(rowHTML).join('')}</div>
    <button type="button" class="btn block" id="addRow">＋ Ajouter une ligne</button>
    <div class="btn-row"><button class="btn primary block" id="saveBtn">💾 Enregistrer et actualiser le registre</button></div>`;

  const rowsEl=$('#rows');
  const live=el=>{ const r=readRow(el); el.querySelector('.live').innerHTML=r.param&&r.val?badge(status(r))+` <span class="muted">${esc(refTxt(r))}</span>`:''; };
  const renum=()=>rowsEl.querySelectorAll('.frow').forEach((el,i)=>{ el.querySelector('.num').innerHTML='Résultat '+(i+1); live(el); });
  rowsEl.addEventListener('input',e=>{ const el=e.target.closest('.frow'); if(el) live(el); });
  rowsEl.addEventListener('change',e=>{
    if(e.target.dataset.f!=='param') return;
    const el=e.target.closest('.frow'),p=R.get(keyOf(e.target.value)); if(!p) return;
    const set=(f,v)=>{ const i=el.querySelector(`[data-f="${f}"]`); if(!i.value&&v!=null&&v!=='') i.value=typeof v==='number'?fmtN(v):v; };
    set('cat',p.cat); set('unit',p.last.unit); set('min',p.last.min); set('max',p.last.max); live(el);
  });
  rowsEl.addEventListener('click',e=>{ if(!e.target.classList.contains('rm')) return; buzz();
    const el=e.target.closest('.frow');
    if(rowsEl.querySelectorAll('.frow').length>1){ el.animate([{opacity:1,transform:'none'},{opacity:0,transform:'perspective(700px) rotateX(60deg) scale(.8)'}],{duration:280,easing:'ease-in'}).onfinish=()=>{ el.remove(); renum(); }; }
    else { el.querySelectorAll('input').forEach(i=>i.value=''); live(el); } });
  $('#addRow').onclick=()=>{ buzz(); rowsEl.insertAdjacentHTML('beforeend',rowHTML()); renum(); rowsEl.lastElementChild.querySelector('input').focus(); };
  $('#pasteGo').onclick=()=>{
    let raw=$('#pasteTxt').value, meta=0;
    raw=raw.replace(/^\s*(date|labo|laboratoire|titre|intitul[ée]|notes?)\s*[:=]\s*(.+)$/gim,(_,k,v)=>{ v=v.trim(); k=k.toLowerCase(); meta++;
      if(k==='date'){ const m=v.match(/(\d{4})-(\d{2})-(\d{2})/)||v.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/); if(m){ const iso=m[1].length===4?`${m[1]}-${m[2]}-${m[3]}`:`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; $('#fDate').value=iso; } }
      else if(k.startsWith('labo')) $('#fLabo').value=v; else if(k.startsWith('not')) $('#fNotes').value=v; else $('#fTitre').value=v; return ''; });
    const list=parsePaste(raw); if(!list.length){ toast(meta?'En-tête importé':'Aucune ligne reconnue'); return; }
    rowsEl.querySelectorAll('.frow').forEach(el=>{ const r=readRow(el); if(!r.param&&!r.val) el.remove(); });
    rowsEl.insertAdjacentHTML('beforeend',list.map(rowHTML).join('')); renum(); $('#pasteTxt').value=''; toast(list.length+' ligne(s) ajoutée(s)');
  };
  const tSel=$('#target');
  const sync=()=>{ if(tSel) $('#bilanFields').style.display=tSel.value?'none':''; };
  if(tSel){ tSel.onchange=sync; sync(); }
  renum();

  const formPJ=[];
  $('#saveBtn').onclick=async e=>{
    const res=[...rowsEl.querySelectorAll('.frow')].map(readRow).filter(r=>r.param&&r.val);
    const notes=$('#fNotes').value.trim();
    if(!res.length&&!formPJ.length&&!(notes&&!(tSel&&tSel.value))){ toast('Renseignez un résultat ou ajoutez un document'); buzz(60); return; }
    const bb=e.currentTarget.getBoundingClientRect(); const celebrate=()=>{ burst(bb.left+bb.width/2,bb.top); buzz([12,40,12]); };
    let ids=[];
    try{ for(const o of formPJ){ await IDB.put(o); ids.push(o.id); } }catch(err){ toast('⚠️ Document non conservé (stockage plein ?)'); ids=[]; }
    if(editing){
      Object.assign(editing,{date:$('#fDate').value||editing.date,labo:$('#fLabo').value.trim(),titre:$('#fTitre').value.trim(),notes,resultats:res,pj:[...(editing.pj||[]),...ids]});
      save(); celebrate(); toast('Bilan mis à jour ✔'); location.hash='#/bilan/'+editing.id; return;
    }
    if(tSel&&tSel.value){
      const b=db.bilans.find(x=>x.id===tSel.value);
      res.forEach(r=>{ const i=b.resultats.findIndex(x=>keyOf(x.param)===keyOf(r.param)); i>=0?b.resultats[i]=r:b.resultats.push(r); });
      b.pj=[...(b.pj||[]),...ids];
      save(); celebrate(); toast('Registre actualisé ✔'); location.hash='#/bilan/'+b.id; return;
    }
    if(!$('#fDate').value){ toast('Indiquez la date du bilan'); return; }
    db.bilans.push({id:uid(),date:$('#fDate').value,labo:$('#fLabo').value.trim(),titre:$('#fTitre').value.trim()||'Bilan',notes,resultats:res,pj:ids});
    save(); celebrate(); toast('Registre actualisé ✔'); location.hash='#/registre';
  };
}

/* ============ ROUTAGE + TRANSITIONS 3D ============ */
const TAB={registre:0,alertes:1,ajouter:2,bilans:3};
let prev={lv:0,idx:0},navDepth=0,first=true;
const parse=()=>{ const parts=(location.hash.replace(/^#\/?/,'')||'registre').split('/'); return {p:parts[0],a:parts.slice(1).join('/')}; };
function render(){
  const {p,a}=parse();
  if(p==='param') vParam(decodeURIComponent(a));
  else if(p==='alertes') vAlertes();
  else if(p==='bilans') vBilans();
  else if(p==='bilan') vBilan(a);
  else if(p==='ajouter') vForm('add',a);
  else if(p==='modifier') vForm('edit',a);
  else vRegistre();
  window.scrollTo(0,0);
  afterRender();
}
function route(){
  const {p}=parse();
  const lv=['param','bilan','modifier'].includes(p)||(p==='ajouter'&&parse().a)?1:0;
  const idx=TAB[p]!==undefined&&!(p==='ajouter'&&parse().a)?TAB[p]:(p==='bilan'||p==='modifier'?3:prev.idx);
  const d=first?'fwd':lv>prev.lv?'fwd':lv<prev.lv?'back':idx>prev.idx?'right':idx<prev.idx?'left':'fade';
  prev={lv,idx}; ui.dir=d; first=false;
  $('#ind').style.setProperty('--x',idx);
  document.querySelectorAll('.tab[data-i]').forEach(t=>t.classList.toggle('on',+t.dataset.i===idx));
  document.documentElement.dataset.dir=d;
  if(document.startViewTransition&&!REDUCE){ try{ document.startViewTransition(render); return; }catch(e){} }
  render();
  const v=$('#view'); v.classList.remove('enter'); void v.offsetWidth; v.dataset.dir=d; v.classList.add('enter');
}
window.addEventListener('hashchange',()=>{ if(!user) return; navDepth++; route(); });
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ buzz(); if(location.hash===b.dataset.go) return; location.hash=b.dataset.go; });

/* ============ INCLINAISON 3D (souris + gyroscope) ============ */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
document.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse') return;
  document.querySelectorAll('.tilt').forEach(el=>{ const r=el.getBoundingClientRect(); const inside=e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom;
    if(inside){ const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height; el.style.setProperty('--ry',((x-.5)*10)+'deg'); el.style.setProperty('--rx',((.5-y)*10)+'deg'); el.style.setProperty('--mx',x*100+'%'); el.style.setProperty('--my',y*100+'%'); }
    else { el.style.setProperty('--rx','0deg'); el.style.setProperty('--ry','0deg'); } });
});
let gyroRAF=0;
window.addEventListener('deviceorientation',e=>{
  if(e.beta==null||gyroRAF) return;
  gyroRAF=requestAnimationFrame(()=>{ gyroRAF=0; const h=$('#hero'); if(!h) return;
    const rx=clamp((e.beta-50)/3,-9,9),ry=clamp(e.gamma/3,-9,9);
    h.style.setProperty('--rx',(-rx)+'deg'); h.style.setProperty('--ry',ry+'deg'); h.style.setProperty('--mx',(50+ry*4)+'%'); h.style.setProperty('--my',(50+rx*4)+'%'); });
});

/* ============ FEUILLE « PLUS » ============ */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; });
const openSheet=o=>{ if(o&&user) $('#sheetUser').innerHTML=`<div class="avatar" style="display:grid;background:${user.g};box-shadow:0 0 18px ${user.glow}">${user.ini}</div><div><b>${esc(user.name)}</b><div class="small muted">☁️ GitHub · ${esc((cfgGH()||{}).repo||'')}</div></div>`; $('#sheet').classList.toggle('open',o); $('#sheetBg').classList.toggle('open',o); $('#moreTab').classList.toggle('on',o); if(!o) document.querySelectorAll('.tab[data-i]').forEach(t=>t.classList.toggle('on',+t.dataset.i===prev.idx)); };

$('#sheet').onclick=e=>{

  if(act==='pw'){ $('#pw1').value=''; $('#pw2').value=''; $('#pwMsg').textContent=''; $('#pwModal').classList.add('on'); }

};
$('#fileIn').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!Array.isArray(d.bilans)) throw 0; if(confirm('Remplacer les données actuelles par cette sauvegarde ?')){ const att=d.attachments||[]; delete d.attachments; db=d; save(); Promise.all(att.map(o=>IDB.put(o))).catch(()=>toast('⚠️ Documents non restaurés')); route(); toast('Sauvegarde importée ✔'); } }catch(err){ toast('Fichier invalide'); } e.target.value=''; };
  rd.readAsText(f);
};

async function exportAll(){
  let att=[]; try{ const used=new Set(db.bilans.flatMap(b=>b.pj||[])); att=(await IDB.all()).filter(o=>used.has(o.id)); }catch(e){}
  const blob=new Blob([JSON.stringify({...db,attachments:att},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='dossier-sante-'+user.id+'-'+today()+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast('Sauvegarde téléchargée'+(att.length?' (avec '+att.length+' document'+(att.length>1?'s':'')+')':''));
}
$('#lightbox').onclick=()=>$('#lightbox').classList.remove('on');

/* ============ CONNEXION ============ */
const L={uid:null,mode:'pick',pin:'',first:'',busy:false,pending:null};
function showLogin(uid,mode){
  document.body.classList.add('locked'); openSheet(false);
  L.uid=uid||null; L.pin=''; L.first=''; L.busy=false;
  if(!uid){ L.mode=cfgGH()?'pick':'nodb'; L.pending=null; }
  else L.mode=mode||(getDev(uid)?'enter':'signin');
  drawLogin();
}
const logoSVG='<div class="lg-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></div>';
function drawLogin(){
  const box=$('#login');
  if(L.mode==='nodb'){
    box.innerHTML=`<div class="lg-in">${logoSVG}<h1 class="lg-h">Configuration</h1>
      <p class="muted small" style="margin:0 0 18px">Où sont stockés les dossiers chiffrés ?</p>
      <form class="lg-form glass" id="dbForm">
        <label class="f">Compte GitHub</label><input class="in mb" id="ghOwner" placeholder="ex. mzangre" required autocapitalize="off">
        <label class="f">Dépôt privé des données</label><input class="in mb" id="ghRepo" value="${esc(GH_REPO)}" required autocapitalize="off">
        <button class="btn primary block" type="submit">Enregistrer</button></form>
      <p class="foot">Une fois l'appli publiée sur ton-compte.github.io, cet écran n'apparaît plus.</p></div>`;
    $('#dbForm').onsubmit=e=>{ e.preventDefault(); localStorage.setItem('ds-gh',JSON.stringify({owner:$('#ghOwner').value.trim(),repo:$('#ghRepo').value.trim()})); showLogin(null); };
    return;
  }
  if(L.mode==='pick'){
    box.innerHTML=`<div class="lg-in">${logoSVG}
      <h1 class="lg-h">Dossier santé</h1><p class="muted small" style="margin:0 0 26px">Qui se connecte ?</p>
      <div class="profiles">${USERS.map((u,i)=>`<button class="profile glass" data-u="${u.id}" style="--i:${i}">
        <span class="pav" style="background:${u.g};box-shadow:0 0 26px ${u.glow}">${u.ini}</span>
        <b>${esc(u.first)}</b><small>${esc(u.name.split(' ').slice(1).join(' '))}</small>
        <em>${getDev(u.id)?'🔒 Code rapide':'☁️ Se connecter'}</em></button>`).join('')}</div>
      <p class="foot">☁️ Dossiers synchronisés sur GitHub et chiffrés de bout en bout.<br>Ni l'autre profil, ni GitHub ne peuvent les lire.</p></div>`;
    box.querySelectorAll('.profile').forEach(b=>b.onclick=()=>{ buzz(); b.classList.add('chosen'); setTimeout(()=>showLogin(b.dataset.u),260); });
    return;
  }
  const u=USERS.find(x=>x.id===L.uid);
  const head=`<button class="lg-back" id="lgBack">‹ ${['change','newpin','newconfirm'].includes(L.mode)&&user?'Annuler':'Profils'}</button>
    <span class="pav big" style="background:${u.g};box-shadow:0 0 34px ${u.glow}">${u.ini}</span><h2 class="lg-name">${esc(u.name)}</h2>`;
  if(L.mode==='signin'||L.mode==='newdossier'){
    const nd=L.mode==='newdossier';
    box.innerHTML=`<div class="lg-in pad-in">${head}
      <div class="lg-t">${nd?'Création de ton dossier':'Connexion'}</div>
      <div class="muted small" style="margin-bottom:16px">${nd?'Aucun dossier en ligne pour l\'instant : confirme ton mot de passe pour le créer':'Première connexion sur ce téléphone'}</div>
      <form class="lg-form glass" id="siForm" autocomplete="on">
        ${nd?`<label class="f">Confirme le mot de passe du dossier</label><input class="in mb" id="siPw2" type="password" autocomplete="new-password" required>
              <p class="small muted" style="margin:-2px 0 10px">⚠️ Sans ce mot de passe, le dossier ne peut pas être déchiffré. Note-le en lieu sûr.</p>`
          :`<label class="f">Jeton d'accès GitHub</label><input class="in mb" id="siTok" type="password" placeholder="github_pat_…" autocomplete="off" required>
            <label class="f">Mot de passe du dossier</label><input class="in mb" id="siPw" type="password" autocomplete="current-password" minlength="8" required>`}
        <div class="lg-msg" id="lgMsg"></div>
        <button class="btn primary block" type="submit" id="siBtn">${nd?'Créer mon dossier':'Se connecter'}</button></form>
      <p class="foot">${nd?'8 caractères minimum.':'Ensuite, tu choisiras un code rapide à 6 chiffres pour ce téléphone.'}</p></div>`;
    $('#lgBack').onclick=()=>{ buzz(); showLogin(null); };
    $('#siForm').onsubmit=async e=>{ e.preventDefault(); if(L.busy) return; L.busy=true; const btn=$('#siBtn'),lbl=btn.textContent; btn.textContent='Connexion…'; btn.disabled=true; $('#lgMsg').textContent='';
      try{ nd?await doCreate($('#siPw2').value):await doSignIn($('#siTok').value.trim(),$('#siPw').value); }
      catch(err){ console.error(err); $('#lgMsg').textContent=err.offline?'Pas de connexion internet':err.message; buzz([40,40,40]); btn.textContent=lbl; btn.disabled=false; L.busy=false; } };
    return;
  }
  const title={enter:'Entre ton code',create:'Choisis ton code rapide',confirm:'Confirme ton code',change:'Code actuel',newpin:'Nouveau code',newconfirm:'Confirme le nouveau code'}[L.mode];
  const sub={enter:'6 chiffres',create:'6 chiffres pour ouvrir l\'appli sur ce téléphone',confirm:'Retape le même code',change:'Pour changer ton code rapide',newpin:'6 chiffres',newconfirm:'Retape le nouveau code'}[L.mode];
  box.innerHTML=`<div class="lg-in pad-in">${head}
    <div class="lg-t">${title}</div><div class="muted small">${sub}</div>
    <div class="dots" id="dots">${Array.from({length:6},(_,i)=>`<i class="${i<L.pin.length?'on':''}"></i>`).join('')}</div>
    <div class="lg-msg" id="lgMsg"></div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9,'forgot',0,'del'].map(k=>k==='forgot'?(L.mode==='enter'?'<button class="key ghost" data-k="forgot">Oublié ?</button>':'<span></span>'):k==='del'?'<button class="key ghost" data-k="del">⌫</button>':`<button class="key" data-k="${k}">${k}</button>`).join('')}</div>
  </div>`;
  $('#lgBack').onclick=()=>{ buzz(); if(user&&['change','newpin','newconfirm'].includes(L.mode)){ document.body.classList.remove('locked'); route(); } else showLogin(null); };
  box.querySelector('.keypad').onclick=e=>{ const k=e.target.closest('[data-k]')?.dataset.k; if(k!=null) key(k); };
