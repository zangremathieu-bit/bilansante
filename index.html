function paintDots(state){ const d=$('#dots'); if(!d) return; d.querySelectorAll('i').forEach((x,i)=>x.classList.toggle('on',i<L.pin.length)); d.className='dots'+(state?' '+state:''); }
function fail(msg){ buzz([40,40,40]); const d=$('#dots'); if(!d) return; d.classList.remove('shake'); void d.offsetWidth; paintDots('shake'); $('#lgMsg').textContent=msg; L.pin=''; setTimeout(()=>paintDots(),450); }

/* Récupère d'anciennes données locales (versions précédentes de l'appli) */
async function migrateLocal(uid){
  if(uid==='mathieu'){ try{ const o=JSON.parse(localStorage.getItem(KEY)); if(o&&Array.isArray(o.bilans)) return o; }catch(e){} }
  let r; try{ r=JSON.parse(localStorage.getItem('ds-u-'+uid)); }catch(e){}
  if(!r) return null;
  for(let t=0;t<3;t++){
    const pin=prompt('Des données de l\'ancienne version sont sur ce téléphone.\nTape ton ANCIEN code à 6 chiffres pour les récupérer (laisse vide pour ignorer) :');
    if(!pin) return null;
    try{ const k=await pbk(pin,fromB64(r.salt)); return await decJSON(k,{iv:r.iv,ct:r.ct}); }catch(e){ alert('Code incorrect'); }
  }
  return null;
}
async function doSignIn(tok,pw){
  if(pw.length<8) throw new Error('Mot de passe : 8 caractères minimum');
  G.tok=tok; await checkRepo();
  const f=await getFile(L.uid);
  if(f){
    let k;
    try{ k=await importDEK(await decRaw(await pbk(pw,fromB64(f.row.wrap_salt)),{iv:f.row.wrap_iv,ct:f.row.wrap_ct})); }
    catch(e){ throw new Error('Mot de passe du dossier incorrect'); }
    const data=await decJSON(k,{iv:f.row.data_iv,ct:f.row.data_ct});
    L.pending={tok,k,data,row:f.row,sha:f.sha};
    L.busy=false; L.mode='create'; L.pin=''; drawLogin(); toast('Connecté·e ☁️ — choisis ton code rapide'); return;
  }
  L.pending={tok,pw}; L.busy=false; L.mode='newdossier'; drawLogin();
}
async function doCreate(pw2){
  const P=L.pending; if(pw2!==P.pw) throw new Error('Les mots de passe ne correspondent pas');
  const k=await newDEK(), data=(await migrateLocal(L.uid))||{version:1,bilans:[]};
  const salt=rand(16), w=await encRaw(await pbk(P.pw,salt),await rawDEK(k)), e=await encJSON(k,data);
  const row={v:1,wrap_salt:toB64(salt),wrap_iv:w.iv,wrap_ct:w.ct,data_iv:e.iv,data_ct:e.ct,updated_at:new Date().toISOString()};
  const sha=await putFile(L.uid,row,null);
  localStorage.removeItem('ds-u-'+L.uid); if(L.uid==='mathieu') localStorage.removeItem(KEY);
  L.pending={tok:P.tok,k,data,row,sha}; L.busy=false; L.mode='create'; L.pin=''; drawLogin(); toast('Dossier créé sur GitHub 🎉 — choisis ton code rapide');
}
async function key(k){
  if(L.busy) return;
  if(k==='forgot'){ const u=USERS.find(x=>x.id===L.uid);
    if(confirm('Tu vas te reconnecter avec ton jeton GitHub et le mot de passe du dossier, puis choisir un nouveau code.\nTes données en ligne sont conservées.')){
      const d=getDev(L.uid); if(d&&d.dirty&&!confirm('⚠️ Des modifications n\'ont pas encore été envoyées en ligne et seront perdues. Continuer ?')) return;
      localStorage.removeItem(DEV(L.uid)); showLogin(L.uid,'signin'); } return; }
  if(k==='del'){ L.pin=L.pin.slice(0,-1); paintDots(); buzz(); return; }
  if(L.pin.length>=6) return;
  L.pin+=k; buzz(6); paintDots(); $('#lgMsg').textContent='';
  if(L.pin.length<6) return;
  const pin=L.pin; L.busy=true;
  try{
    if(L.mode==='create'||L.mode==='newpin'){ L.first=pin; L.pin=''; L.mode=L.mode==='create'?'confirm':'newconfirm'; L.busy=false; setTimeout(drawLogin,180); return; }
    if(L.mode==='confirm'||L.mode==='newconfirm'){
      if(pin!==L.first){ L.mode=L.mode==='confirm'?'create':'newpin'; L.busy=false; drawLogin(); fail('Les codes ne correspondent pas, recommence'); return; }
      paintDots('ok'); $('#lgMsg').textContent='Sécurisation…';
      const salt=rand(16), pk=await pbk(pin,salt);
      if(L.mode==='newconfirm'){
        const d=getDev(user.id); d.pinSalt=toB64(salt); d.dekWrap=await encRaw(pk,await rawDEK(dek)); setDev(user.id,d);
        L.busy=false; document.body.classList.remove('locked'); route(); toast('Code rapide modifié 🔑'); return;
      }
      const P=L.pending;
      const d={pinSalt:toB64(salt),dekWrap:await encRaw(pk,await rawDEK(P.k)),tok:await encJSON(P.k,P.tok),sha:P.sha,
        wrap:{wrap_salt:P.row.wrap_salt,wrap_iv:P.row.wrap_iv,wrap_ct:P.row.wrap_ct},
        cache:{iv:P.row.data_iv,ct:P.row.data_ct,updated_at:P.row.updated_at},dirty:false};
      setDev(L.uid,d); L.pending=null;
      G.tok=P.tok; enterApp(L.uid,P.k,P.data,'Dossier prêt 🎉'); return;
    }
    if(L.mode==='enter'||L.mode==='change'){
      const d=getDev(L.uid); paintDots('ok');
      let k2;
      try{ k2=await importDEK(await decRaw(await pbk(pin,fromB64(d.pinSalt)),d.dekWrap)); }catch(e){ L.busy=false; fail('Code incorrect'); return; }
      if(L.mode==='change'){ L.pin=''; L.mode='newpin'; L.busy=false; drawLogin(); return; }
      G.tok=await decJSON(k2,d.tok);
      const data=await decJSON(k2,d.cache);
      enterApp(L.uid,k2,data,'Bonjour '+USERS.find(x=>x.id===L.uid).first+' 👋',true); return;
    }
  }catch(e){ console.error(e); L.busy=false; fail('Erreur : '+e.message); }
}
function enterApp(uid,k2,data,msg,sync){
  user=USERS.find(x=>x.id===uid); dek=k2; db=data; if(!Array.isArray(db.bilans)) db.bilans=[];
  const box=$('#login'); const r=box.getBoundingClientRect(); burst(r.width/2,r.height*.35);
  box.classList.add('leaving'); buzz([10,30,10]);
  setTimeout(()=>{ document.body.classList.remove('locked'); box.classList.remove('leaving'); box.innerHTML='';
    ui.filter='Tous'; ui.q=''; prev={lv:0,idx:0}; first=true; navDepth=0;
    if(location.hash!=='#/registre') history.replaceState(null,'','#/registre'); route(); toast(msg);
    setSync('wait');
    if(sync) syncNow(); else setSync('ok');
  },420);
}
async function syncNow(){ if(!user) return; await pushData(); const changed=await pull(); if(changed&&user){ route(); toast('☁️ Mis à jour depuis un autre appareil'); } }
function lock(){ user=null; dek=null; db=null; G.tok=null; $('#view').innerHTML=''; showLogin(null); }
async function logoutDevice(){
  const d=getDev(user.id);
  if(d&&d.dirty){ await pushData(); if(getDev(user.id)?.dirty&&!confirm('⚠️ Des modifications ne sont pas encore en ligne (pas de connexion). Elles seront perdues. Continuer ?')) return; }
  localStorage.removeItem(DEV(user.id)); toast('Appareil déconnecté'); lock();
}
async function changePassword(){
  const np=$('#pw1').value, np2=$('#pw2').value;
  if(np.length<8){ $('#pwMsg').textContent='8 caractères minimum'; return; }
  if(np!==np2){ $('#pwMsg').textContent='Les mots de passe ne correspondent pas'; return; }
  $('#pwMsg').textContent='Mise à jour…'; $('#pwSave').disabled=true;
  try{
    await pushData(); const d=getDev(user.id); if(d.dirty) throw Object.assign(new Error(''),{offline:true});
    const f=await getFile(user.id), salt=rand(16), w=await encRaw(await pbk(np,salt),await rawDEK(dek));
    const wrap={wrap_salt:toB64(salt),wrap_iv:w.iv,wrap_ct:w.ct};
    const sha=await putFile(user.id,{...(f?f.row:{v:1,data_iv:d.cache.iv,data_ct:d.cache.ct,updated_at:d.cache.updated_at}),...wrap},f&&f.sha);
    const d2=getDev(user.id); d2.wrap=wrap; d2.sha=sha; setDev(user.id,d2);
    $('#pwModal').classList.remove('on'); toast('Mot de passe modifié 🔐');
  }catch(e){ $('#pwMsg').textContent=e.offline?'Connexion internet requise':e.message; }
  $('#pwSave').disabled=false;
}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt=Date.now(); return; }
  if(user&&hiddenAt&&Date.now()-hiddenAt>3*60*1000){ lock(); toast('Verrouillé après inactivité'); return; }
  if(user) syncNow();
});
document.addEventListener('keydown',e=>{ if(!document.body.classList.contains('locked')||!['enter','create','confirm','change','newpin','newconfirm'].includes(L.mode)) return; if(/^\d$/.test(e.key)) key(e.key); else if(e.key==='Backspace') key('del'); });
$('#avatar').onclick=()=>{ buzz(); openSheet(true); };
$('#pwCancel').onclick=()=>$('#pwModal').classList.remove('on');
$('#pwSave').onclick=changePassword;

showLogin(null);
</script>
